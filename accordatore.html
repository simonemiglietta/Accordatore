<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Accordatore Chitarra</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; padding: 1rem; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1rem; color: #1a1a1a; }

  .tunings-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .tuning-btn { font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 0.5px solid #bbb; background: #fff; color: #1a1a1a; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tuning-btn.active { background: #e8e8e4; border-color: #888; font-weight: 500; }

  .strings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
  .string-btn { padding: 10px 4px; border-radius: 10px; border: 0.5px solid #ddd; background: #fff; color: #1a1a1a; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
  .string-btn .note { font-size: 20px; font-weight: 500; }
  .string-btn .freq { font-size: 11px; color: #888; margin-top: 2px; }
  .string-btn.selected { border: 2px solid #378ADD; background: #E6F1FB; color: #0C447C; }
  .string-btn.selected .freq { color: #185FA5; }

  .meter-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
  .detected-note { font-size: 48px; font-weight: 500; line-height: 1; color: #1a1a1a; }
  .detected-freq { font-size: 13px; color: #888; margin-top: 4px; margin-bottom: 14px; }
  svg.gauge { width: 100%; height: 90px; }
  .cents-label { font-size: 14px; margin-top: 10px; color: #888; min-height: 22px; }
  .cents-label.in-tune { color: #2d7a2d; font-weight: 500; }
  .cents-label.sharp { color: #c0392b; }
  .cents-label.flat { color: #185FA5; }

  .history-wrap { margin-top: 14px; }
  .history-label { font-size: 11px; color: #aaa; margin-bottom: 5px; text-align: left; }
  .history-bar { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
  .history-bar .hbar { flex: 1; border-radius: 3px; min-height: 3px; }

  .controls-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .ctrl-row { display: flex; align-items: center; gap: 10px; }
  .ctrl-label { font-size: 13px; color: #888; white-space: nowrap; min-width: 80px; }
  .ctrl-row input[type=range] { flex: 1; }
  .ctrl-val { font-size: 13px; font-weight: 500; min-width: 32px; text-align: right; }

  .start-btn { width: 100%; padding: 14px; border-radius: 10px; border: 0.5px solid #bbb; background: #f0f0ec; color: #1a1a1a; font-size: 15px; cursor: pointer; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
  .start-btn.active { background: #EAF3DE; border-color: #639922; color: #2d6e11; font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex-shrink: 0; }
  .dot.on { background: #1D9E75; }

  .custom-section { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem; }
  .custom-title { font-size: 13px; color: #888; margin-bottom: 8px; }
  .custom-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .custom-inputs input { width: 100%; font-size: 14px; text-align: center; padding: 7px 4px; border-radius: 8px; border: 0.5px solid #bbb; background: #fff; color: #1a1a1a; }
  .apply-btn { width: 100%; padding: 9px; border-radius: 8px; border: 0.5px solid #bbb; background: #f0f0ec; color: #1a1a1a; font-size: 13px; cursor: pointer; }

  /* Tab nav */
  .tab-nav { display: flex; gap: 0; margin-bottom: 1rem; border: 0.5px solid #ddd; border-radius: 10px; overflow: hidden; background: #f0f0ec; }
  .tab-btn { flex: 1; padding: 10px 4px; font-size: 13px; border: none; background: transparent; color: #888; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tab-btn.active { background: #fff; color: #1a1a1a; font-weight: 500; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Looper */
  .looper-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .looper-status { font-size: 13px; color: #888; text-align: center; margin-bottom: 14px; min-height: 20px; }
  .looper-status.recording { color: #c0392b; font-weight: 500; }
  .looper-status.playing { color: #2d7a2d; font-weight: 500; }

  .looper-waveform { width: 100%; height: 60px; border-radius: 8px; background: #f5f5f0; border: 0.5px solid #eee; margin-bottom: 14px; display: block; }

  .looper-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .lbtn { padding: 14px 8px; border-radius: 10px; border: 0.5px solid #bbb; background: #f0f0ec; color: #1a1a1a; font-size: 14px; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lbtn span.licon { font-size: 22px; line-height: 1; }
  .lbtn span.llabel { font-size: 11px; color: #888; }
  .lbtn.rec-active { background: #fdecea; border-color: #e57368; color: #c0392b; }
  .lbtn.rec-active .llabel { color: #c0392b; }
  .lbtn.play-active { background: #EAF3DE; border-color: #639922; color: #2d6e11; }
  .lbtn.play-active .llabel { color: #2d6e11; }
  .lbtn:disabled { opacity: 0.35; pointer-events: none; }

  .looper-vol-row { display: flex; align-items: center; gap: 10px; }
  .looper-vol-row input[type=range] { flex: 1; }
  .looper-vol-label { font-size: 12px; color: #aaa; white-space: nowrap; }

  .loop-progress-wrap { height: 4px; border-radius: 2px; background: #eee; margin-bottom: 12px; overflow: hidden; }
  .loop-progress-bar { height: 100%; width: 0%; background: #1D9E75; border-radius: 2px; transition: width 0.05s linear; }
</style>
</head>
<body>
<h1>🎸 Accordatore</h1>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('tuner',this)">Accordatore</button>
  <button class="tab-btn" onclick="switchTab('looper',this)">Looper</button>
  <button class="tab-btn" onclick="switchTab('custom',this)">Custom</button>
</div>

<div class="tab-panel active" id="tab-tuner">
<div class="tunings-row" id="tunings-row"></div>
<div class="strings-grid" id="strings-grid"></div>

<div class="meter-card">
  <div class="detected-note" id="detected-note">—</div>
  <div class="detected-freq" id="detected-freq">0.0 Hz</div>
  <svg class="gauge" viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg">
    <path d="M 30 85 A 120 120 0 0 1 270 85" fill="none" stroke="#ddd" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 85 A 120 120 0 0 1 150 85" fill="none" stroke="#9FE1CB" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 150 85 A 120 120 0 0 1 270 85" fill="none" stroke="#F5C4B3" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <rect x="146" y="20" width="8" height="40" rx="4" fill="#1D9E75" opacity="0.3"/>
    <line id="needle" x1="150" y1="85" x2="150" y2="20" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="85" r="5" fill="#378ADD"/>
    <text x="26" y="82" font-size="10" fill="#aaa" text-anchor="middle">−50</text>
    <text x="274" y="82" font-size="10" fill="#aaa" text-anchor="middle">+50</text>
    <text x="150" y="12" font-size="10" fill="#aaa" text-anchor="middle">0</text>
  </svg>
  <div class="cents-label" id="cents-label">seleziona una corda e avvia</div>
  <div class="history-wrap">
    <div class="history-label">Stabilità ultimi 2 sec</div>
    <div class="history-bar" id="history-bar"></div>
  </div>
</div>

<div class="controls-card">
  <div class="ctrl-row">
    <span class="ctrl-label">Sensibilità</span>
    <input type="range" id="sensitivity" min="1" max="10" step="1" value="5">
    <span class="ctrl-val" id="sens-val">5</span>
  </div>
</div>

<button class="start-btn" id="start-btn">
  <span class="dot" id="dot"></span><span id="btn-label">Avvia microfono</span>
</button>
</div><!-- /tab-tuner -->

<!-- TAB: Looper -->
<div class="tab-panel" id="tab-looper">
<div class="looper-card">
  <div class="looper-status" id="looper-status">Premi REC per iniziare</div>
  <canvas class="looper-waveform" id="looper-waveform"></canvas>
  <div class="loop-progress-wrap"><div class="loop-progress-bar" id="loop-progress"></div></div>
  <div class="looper-btns">
    <button class="lbtn" id="lbtn-rec" onclick="looperRec()">
      <span class="licon">⏺</span><span class="llabel">REC</span>
    </button>
    <button class="lbtn" id="lbtn-play" onclick="looperPlay()" disabled>
      <span class="licon">▶</span><span class="llabel">PLAY / LOOP</span>
    </button>
    <button class="lbtn" id="lbtn-stop" onclick="looperStop()" disabled>
      <span class="licon">⏹</span><span class="llabel">STOP</span>
    </button>
    <button class="lbtn" id="lbtn-clear" onclick="looperClear()" disabled>
      <span class="licon">🗑</span><span class="llabel">CANCELLA</span>
    </button>
  </div>
  <div class="looper-vol-row">
    <span class="looper-vol-label">Volume loop</span>
    <input type="range" id="loop-vol" min="0" max="100" step="1" value="80" oninput="setLoopVol(this.value)">
    <span class="looper-vol-label" id="loop-vol-val">80%</span>
  </div>
</div>
</div><!-- /tab-looper -->

<!-- TAB: Custom -->
<div class="tab-panel" id="tab-custom">
<div class="custom-section">
  <div class="custom-title">Accordatura personalizzata (es. E2, G#3, Bb4)</div>
  <div class="custom-inputs" id="custom-inputs"></div>
  <button class="apply-btn" id="apply-btn">Applica accordatura custom</button>
</div>
</div><!-- /tab-custom -->

<script>
const TUNINGS = {
  "Standard": ["E2","A2","D3","G3","B3","E4"],
  "Drop D":   ["D2","A2","D3","G3","B3","E4"],
  "Open G":   ["D2","G2","D3","G3","B3","D4"],
  "DADGAD":   ["D2","A2","D3","G3","A3","D4"],
  "Open E":   ["E2","B2","E3","G#3","B3","E4"],
};
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const STRING_LABELS = ["6ª","5ª","4ª","3ª","2ª","1ª"];
const HISTORY_SIZE = 20;

function noteToFreq(note) {
  const m = note.match(/^([A-G]#?)(\d)$/);
  if (!m) return null;
  const n = NOTE_NAMES.indexOf(m[1]);
  if (n < 0) return null;
  const midi = (parseInt(m[2]) + 1) * 12 + n;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function freqToNote(freq) {
  if (freq <= 0) return { name: "—", cents: 0 };
  const midi = 12 * Math.log2(freq / 440) + 69;
  const midiR = Math.round(midi);
  const cents = Math.round((midi - midiR) * 100);
  const n = ((midiR % 12) + 12) % 12;
  const oct = Math.floor(midiR / 12) - 1;
  return { name: NOTE_NAMES[n] + oct, cents };
}

let tunings = JSON.parse(JSON.stringify(TUNINGS));
let currentTuning = "Standard";
let selectedString = 0;
let audioCtx = null, analyser = null, rafId = null, micStream = null, listening = false;
let centsHistory = [];
let lastHistoryTime = 0;

const tuningsRow = document.getElementById("tunings-row");
const stringsGrid = document.getElementById("strings-grid");
const detectedNote = document.getElementById("detected-note");
const detectedFreq = document.getElementById("detected-freq");
const needle = document.getElementById("needle");
const centsLabel = document.getElementById("cents-label");
const startBtn = document.getElementById("start-btn");
const dot = document.getElementById("dot");
const btnLabel = document.getElementById("btn-label");
const customInputsDiv = document.getElementById("custom-inputs");
const applyBtn = document.getElementById("apply-btn");
const historyBar = document.getElementById("history-bar");
const sensitivitySlider = document.getElementById("sensitivity");
const sensVal = document.getElementById("sens-val");

// Crea barre storia
for (let i = 0; i < HISTORY_SIZE; i++) {
  const b = document.createElement("div");
  b.className = "hbar";
  b.style.background = "#eee";
  b.style.height = "3px";
  historyBar.appendChild(b);
}

sensitivitySlider.oninput = () => { sensVal.textContent = sensitivitySlider.value; };

function getRmsThreshold() {
  const s = parseInt(sensitivitySlider.value);
  return 0.055 - (s - 1) * 0.005;
}

function updateHistory(diffCents, inTune) {
  centsHistory.push({ diffCents, inTune });
  if (centsHistory.length > HISTORY_SIZE) centsHistory.shift();
  const bars = historyBar.querySelectorAll(".hbar");
  const offset = HISTORY_SIZE - centsHistory.length;
  bars.forEach((bar, i) => {
    const idx = i - offset;
    if (idx < 0) { bar.style.height = "3px"; bar.style.background = "#eee"; return; }
    const e = centsHistory[idx];
    const h = 3 + (Math.min(Math.abs(e.diffCents), 50) / 50) * 17;
    bar.style.height = h.toFixed(1) + "px";
    bar.style.background = e.inTune ? "#1D9E75" : (e.diffCents > 0 ? "#E57368" : "#378ADD");
  });
}

function resetHistory() {
  centsHistory = [];
  historyBar.querySelectorAll(".hbar").forEach(b => { b.style.height = "3px"; b.style.background = "#eee"; });
}

function buildTuningBtns() {
  tuningsRow.innerHTML = "";
  Object.keys(tunings).forEach(name => {
    const b = document.createElement("button");
    b.className = "tuning-btn" + (name === currentTuning ? " active" : "");
    b.textContent = name;
    b.onclick = () => { currentTuning = name; selectedString = 0; buildTuningBtns(); buildStringBtns(); buildCustomInputs(); resetHistory(); };
    tuningsRow.appendChild(b);
  });
}

function buildStringBtns() {
  stringsGrid.innerHTML = "";
  tunings[currentTuning].forEach((note, i) => {
    const freq = noteToFreq(note);
    const b = document.createElement("button");
    b.className = "string-btn" + (i === selectedString ? " selected" : "");
    b.innerHTML = `<div class="note">${note}</div><div class="freq">${STRING_LABELS[i]} — ${freq ? freq.toFixed(1) : "?"}Hz</div>`;
    b.onclick = () => { selectedString = i; buildStringBtns(); resetHistory(); };
    stringsGrid.appendChild(b);
  });
}

function buildCustomInputs() {
  customInputsDiv.innerHTML = "";
  tunings[currentTuning].forEach((note, i) => {
    const inp = document.createElement("input");
    inp.value = note; inp.placeholder = "es. E2"; inp.dataset.idx = i;
    customInputsDiv.appendChild(inp);
  });
}

applyBtn.onclick = () => {
  const inputs = customInputsDiv.querySelectorAll("input");
  const newNotes = Array.from(inputs).map(i => i.value.trim());
  if (newNotes.some(n => noteToFreq(n) === null)) { alert("Nota non valida! Usa formato tipo E2, G#3…"); return; }
  tunings["Custom"] = newNotes;
  currentTuning = "Custom"; selectedString = 0;
  buildTuningBtns(); buildStringBtns(); buildCustomInputs(); resetHistory();
};

function setNeedle(cents) {
  const clamped = Math.max(-50, Math.min(50, cents));
  const rad = ((clamped / 50) * 75 - 90) * Math.PI / 180;
  needle.setAttribute("x2", (150 + 65 * Math.cos(rad)).toFixed(1));
  needle.setAttribute("y2", (85 + 65 * Math.sin(rad)).toFixed(1));
}

function autoCorrelate(buf, sampleRate, rmsThresh) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < rmsThresh) return -1;
  let r1 = 0, r2 = SIZE - 1;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < 0.2) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < 0.2) { r2 = SIZE - i; break; }
  buf = buf.slice(r1, r2);
  const newSize = buf.length;
  const c = new Array(newSize).fill(0);
  for (let i = 0; i < newSize; i++)
    for (let j = 0; j < newSize - i; j++)
      c[i] += buf[j] * buf[j + i];
  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < newSize; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  let T0 = maxpos;
  const x1 = c[T0-1], x2c = c[T0], x3 = c[T0+1];
  const a = (x1 + x3 - 2*x2c)/2, b2 = (x3-x1)/2;
  if (a) T0 = T0 - b2/(2*a);
  return sampleRate / T0;
}

function update(timestamp) {
  if (!analyser) return;
  rafId = requestAnimationFrame(update);
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, audioCtx.sampleRate, getRmsThreshold());
  if (freq > 60 && freq < 1400) {
    const { name, cents } = freqToNote(freq);
    detectedNote.textContent = name;
    detectedFreq.textContent = freq.toFixed(1) + " Hz";
    setNeedle(cents);
    const targetFreq = noteToFreq(tunings[currentTuning][selectedString]);
    let inTune = false, diff = cents;
    if (targetFreq) {
      diff = Math.round(1200 * Math.log2(freq / targetFreq));
      if (Math.abs(diff) <= 5) {
        centsLabel.textContent = "✓ In accordo!"; centsLabel.className = "cents-label in-tune"; inTune = true;
      } else if (diff > 5) {
        centsLabel.textContent = `+${diff} cents — abbassa`; centsLabel.className = "cents-label sharp";
      } else {
        centsLabel.textContent = `${diff} cents — alza`; centsLabel.className = "cents-label flat";
      }
    }
    if (!lastHistoryTime || timestamp - lastHistoryTime > 100) {
      lastHistoryTime = timestamp;
      updateHistory(diff, inTune);
    }
  }
}

startBtn.onclick = async () => {
  if (listening) {
    listening = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    analyser = audioCtx = micStream = null;
    dot.className = "dot"; btnLabel.textContent = "Avvia microfono";
    startBtn.className = "start-btn";
    centsLabel.textContent = "seleziona una corda e avvia"; centsLabel.className = "cents-label";
    detectedNote.textContent = "—"; detectedFreq.textContent = "0.0 Hz";
    setNeedle(0); resetHistory(); return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    listening = true;
    dot.className = "dot on"; btnLabel.textContent = "Ferma microfono";
    startBtn.className = "start-btn active";
    requestAnimationFrame(update);
  } catch(e) { alert("Impossibile accedere al microfono:\n" + e.message); }
};

buildTuningBtns(); buildStringBtns(); buildCustomInputs();

// ── Tab switching ──────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + id).classList.add("active");
  btn.classList.add("active");
}

// ── Looper ────────────────────────────────────────────────
let loopCtx = null;
let loopStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let loopBuffer = null;
let loopSource = null;
let loopGain = null;
let loopState = "idle"; // idle | recording | playing
let loopStartTime = 0;
let loopDuration = 0;
let loopAnimRaf = null;

const looperStatus = document.getElementById("looper-status");
const lbtnRec = document.getElementById("lbtn-rec");
const lbtnPlay = document.getElementById("lbtn-play");
const lbtnStop = document.getElementById("lbtn-stop");
const lbtnClear = document.getElementById("lbtn-clear");
const loopProgress = document.getElementById("loop-progress");
const loopVolSlider = document.getElementById("loop-vol");
const loopVolVal = document.getElementById("loop-vol-val");
const loopCanvas = document.getElementById("looper-waveform");
const loopCtx2d = loopCanvas.getContext("2d");

function setLoopVol(v) {
  loopVolVal.textContent = v + "%";
  if (loopGain) loopGain.gain.value = v / 100;
}

async function ensureLoopCtx() {
  if (loopCtx) return true;
  try {
    loopStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    loopCtx = new (window.AudioContext || window.webkitAudioContext)();
    return true;
  } catch(e) {
    alert("Impossibile accedere al microfono:\n" + e.message);
    return false;
  }
}

// ── Trim silence + crossfade ──────────────────────────────
function trimAndCrossfade(buffer) {
  const sr = buffer.sampleRate;
  const ch = buffer.numberOfChannels;
  const data = [];
  for (let i = 0; i < ch; i++) data.push(buffer.getChannelData(i));

  const SILENCE_THRESH = 0.02;
  const FRAME = 256;
  const len = data[0].length;

  // Find start: first frame where RMS > threshold
  let startSample = 0;
  for (let i = 0; i < len - FRAME; i += FRAME) {
    let rms = 0;
    for (let j = 0; j < FRAME; j++) rms += data[0][i+j] ** 2;
    if (Math.sqrt(rms / FRAME) > SILENCE_THRESH) { startSample = Math.max(0, i - FRAME); break; }
  }

  // Find end: last frame where RMS > threshold
  let endSample = len;
  for (let i = len - FRAME; i > startSample; i -= FRAME) {
    let rms = 0;
    for (let j = 0; j < FRAME; j++) rms += data[0][i+j] ** 2;
    if (Math.sqrt(rms / FRAME) > SILENCE_THRESH) { endSample = Math.min(len, i + FRAME * 2); break; }
  }

  const trimLen = endSample - startSample;
  if (trimLen < sr * 0.1) return buffer; // too short after trim, return as-is

  // Crossfade length: 30ms or 10% of loop, whichever is shorter
  const xfadeLen = Math.min(Math.floor(sr * 0.03), Math.floor(trimLen * 0.1));

  // Output buffer = trimmed length (crossfade folds tail into head, same length)
  const out = loopCtx.createBuffer(ch, trimLen, sr);

  for (let c2 = 0; c2 < ch; c2++) {
    const src = data[c2];
    const dst = out.getChannelData(c2);

    // Copy trimmed region
    for (let i = 0; i < trimLen; i++) dst[i] = src[startSample + i];

    // Crossfade: fade out head, mix tail into it
    for (let i = 0; i < xfadeLen; i++) {
      const t = i / xfadeLen;                     // 0→1
      const tailIdx = trimLen - xfadeLen + i;
      // head: fade in from 0, tail: fade out to 0
      dst[i] = dst[i] * t + dst[tailIdx] * (1 - t);
    }
    // Zero out the tail region that was folded in (optional but clean)
    for (let i = trimLen - xfadeLen; i < trimLen; i++) {
      const t = (i - (trimLen - xfadeLen)) / xfadeLen;
      dst[i] = dst[i] * (1 - t);
    }
  }

  return out;
}

async function looperRec() {
  if (loopState === "recording") return;
  if (loopState === "playing") looperStop();
  if (!await ensureLoopCtx()) return;

  recordedChunks = [];
  loopBuffer = null;
  drawWaveform(null);
  loopProgress.style.width = "0%";

  mediaRecorder = new MediaRecorder(loopStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    const blob = new Blob(recordedChunks, { type: "audio/webm" });
    const arrayBuf = await blob.arrayBuffer();
    const raw = await loopCtx.decodeAudioData(arrayBuf);
    loopBuffer = trimAndCrossfade(raw);
    loopDuration = loopBuffer.duration;
    drawWaveform(loopBuffer);
    looperStatus.textContent = `Sample pronto — ${loopDuration.toFixed(2)}s`;
    looperStatus.className = "looper-status";
    lbtnPlay.disabled = false;
    lbtnClear.disabled = false;
    lbtnRec.classList.remove("rec-active");
  };

  mediaRecorder.start();
  loopState = "recording";
  looperStatus.textContent = "● Registrazione in corso…";
  looperStatus.className = "looper-status recording";
  lbtnRec.classList.add("rec-active");
  lbtnStop.disabled = false;
  lbtnPlay.disabled = true;
}

function looperPlay() {
  if (!loopBuffer || loopState === "recording") return;
  if (loopState === "playing") { looperStop(); return; }

  loopSource = loopCtx.createBufferSource();
  loopSource.buffer = loopBuffer;
  loopSource.loop = true;
  loopGain = loopCtx.createGain();
  loopGain.gain.value = parseInt(loopVolSlider.value) / 100;
  loopSource.connect(loopGain);
  loopGain.connect(loopCtx.destination);
  loopSource.start();
  loopStartTime = loopCtx.currentTime;
  loopState = "playing";

  looperStatus.textContent = "▶ Loop in riproduzione";
  looperStatus.className = "looper-status playing";
  lbtnPlay.classList.add("play-active");
  lbtnPlay.querySelector(".licon").textContent = "⏸";
  lbtnStop.disabled = false;

  animateProgress();
}

function looperStop() {
  if (loopSource) { try { loopSource.stop(); } catch(e) {} loopSource = null; }
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  if (loopAnimRaf) { cancelAnimationFrame(loopAnimRaf); loopAnimRaf = null; }
  loopState = loopBuffer ? "idle" : "idle";
  loopProgress.style.width = "0%";
  looperStatus.textContent = loopBuffer ? `Sample pronto — ${loopDuration.toFixed(2)}s` : "Premi REC per iniziare";
  looperStatus.className = "looper-status";
  lbtnPlay.classList.remove("play-active");
  lbtnPlay.querySelector(".licon").textContent = "▶";
  lbtnRec.classList.remove("rec-active");
  lbtnStop.disabled = true;
  if (loopBuffer) { lbtnPlay.disabled = false; lbtnClear.disabled = false; }
}

function looperClear() {
  looperStop();
  loopBuffer = null; loopDuration = 0;
  drawWaveform(null);
  looperStatus.textContent = "Premi REC per iniziare";
  looperStatus.className = "looper-status";
  lbtnPlay.disabled = true;
  lbtnClear.disabled = true;
  lbtnStop.disabled = true;
}

function animateProgress() {
  if (loopState !== "playing") return;
  const elapsed = (loopCtx.currentTime - loopStartTime) % loopDuration;
  loopProgress.style.width = ((elapsed / loopDuration) * 100).toFixed(1) + "%";
  loopAnimRaf = requestAnimationFrame(animateProgress);
}

function drawWaveform(buffer) {
  const w = loopCanvas.offsetWidth || 300;
  const h = loopCanvas.offsetHeight || 60;
  loopCanvas.width = w; loopCanvas.height = h;
  loopCtx2d.clearRect(0, 0, w, h);
  if (!buffer) {
    loopCtx2d.fillStyle = "#f5f5f0";
    loopCtx2d.fillRect(0, 0, w, h);
    loopCtx2d.strokeStyle = "#ddd";
    loopCtx2d.lineWidth = 1;
    loopCtx2d.beginPath(); loopCtx2d.moveTo(0, h/2); loopCtx2d.lineTo(w, h/2); loopCtx2d.stroke();
    return;
  }
  const data = buffer.getChannelData(0);
  const step = Math.ceil(data.length / w);
  loopCtx2d.fillStyle = "#f5f5f0";
  loopCtx2d.fillRect(0, 0, w, h);
  loopCtx2d.strokeStyle = "#378ADD";
  loopCtx2d.lineWidth = 1.5;
  loopCtx2d.beginPath();
  for (let i = 0; i < w; i++) {
    let min = 1, max = -1;
    for (let j = 0; j < step; j++) {
      const v = data[i * step + j] || 0;
      if (v < min) min = v; if (v > max) max = v;
    }
    const y1 = ((1 + min) / 2) * h;
    const y2 = ((1 + max) / 2) * h;
    if (i === 0) loopCtx2d.moveTo(i, y1); else loopCtx2d.lineTo(i, y1);
    loopCtx2d.lineTo(i, y2);
  }
  loopCtx2d.stroke();
}

drawWaveform(null);
</script>

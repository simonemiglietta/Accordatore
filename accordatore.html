<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Guitar Tuner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tuner">
<meta name="theme-color" content="#0a0f06">
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #39ff14;
    --green-dim: #2db810;
    --green-glow: rgba(57,255,20,0.18);
    --green-glow-strong: rgba(57,255,20,0.35);
    --amber: #ffb000;
    --red: #ff3b3b;
    --bg: #0a0f06;
    --surface: #0d140a;
    --surface2: #111a0d;
    --border: rgba(57,255,20,0.28);
    --border-bright: rgba(57,255,20,0.5);
    --text: #39ff14;
    --text-dim: #2db810;
    --text-muted: #1d8a0c;
    --font: 'Share Tech Mono', 'Courier New', monospace;
    --radius: 4px;
    --scanline-size: 3px;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(0.75rem + env(safe-area-inset-top)) 0.875rem calc(1rem + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) var(--scanline-size)
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 8px var(--green);
    transition: opacity 0.6s ease;
    overflow: hidden;
    max-height: 40px;
    margin-bottom: 1.1rem;
  }
  h1.hidden {
    opacity: 0;
    max-height: 0 !important;
    margin-bottom: 0 !important;
    padding: 0 !important;
    line-height: 0 !important;
    pointer-events: none;
  }

  /* ── Tabs ── */
  .tab-nav {
    display: flex;
    margin-bottom: 1.1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  .tab-btn {
    flex: 1;
    padding: 8px 4px;
    font-size: 10px;
    font-family: var(--font);
    font-weight: normal;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn.active {
    background: var(--green-glow);
    color: var(--text);
    text-shadow: 0 0 6px var(--green);
  }
  .tab-panel { display: none; height: 0; overflow: hidden; }
  .tab-panel.active { display: block; height: auto; overflow: visible; }

  /* ── Tuning pills ── */
  .tunings-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 15px; }
  .tuning-btn {
    font-size: 10px;
    font-family: var(--font);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tuning-btn.active {
    border-color: var(--green);
    color: var(--text);
    background: var(--green-glow);
    text-shadow: 0 0 6px var(--green);
  }

  /* ── String buttons ── */
  .strings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
  .string-btn {
    padding: 12px 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .string-btn:active { transform: scale(0.97); }
  .string-btn .note { font-size: 20px; font-family: var(--font); letter-spacing: -1px; }
  .string-btn .freq { font-size: 9px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.5px; }
  .string-btn.selected {
    border-color: var(--green);
    color: var(--text);
    background: var(--green-glow);
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 10px var(--green-glow), inset 0 0 8px var(--green-glow);
  }
  .string-btn.selected .freq { color: var(--text-dim); }

  /* ── Meter card ── */
  .meter-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 0.75rem 1rem 0.75rem;
    margin-bottom: 15px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px rgba(0,0,0,0.4);
  }
  .meter-card::before {
    content: '[ TUNER ]';
    position: absolute;
    top: -8px; left: 12px;
    font-size: 9px;
    letter-spacing: 2px;
    background: var(--bg);
    padding: 0 6px;
    color: var(--text-dim);
  }
  .note-display { margin-bottom: 6px; }
  .detected-note {
    font-size: 60px;
    font-family: var(--font);
    font-weight: normal;
    line-height: 1;
    letter-spacing: -3px;
    color: var(--text);
    text-shadow: 0 0 20px var(--green), 0 0 40px rgba(57,255,20,0.3);
    transition: color 0.2s, text-shadow 0.2s;
    display: inline-block;
  }
  .detected-note.in-tune {
    color: var(--text);
    text-shadow: 0 0 30px var(--green), 0 0 60px var(--green), 0 0 80px rgba(57,255,20,0.4);
    animation: pulse-glow 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse-glow {
    from { text-shadow: 0 0 20px var(--green), 0 0 40px rgba(57,255,20,0.3); }
    to   { text-shadow: 0 0 35px var(--green), 0 0 70px var(--green), 0 0 100px rgba(57,255,20,0.5); }
  }
  .detected-freq {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 1px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gauge-canvas { width: 100%; height: 80px; display: block; margin-bottom: 2px; }
  .cents-label {
    font-size: 11px;
    font-family: var(--font);
    letter-spacing: 1px;
    margin-top: 8px;
    color: var(--text-muted);
    min-height: 20px;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .cents-label.in-tune { color: var(--text); text-shadow: 0 0 6px var(--green); }
  .cents-label.sharp { color: var(--red); text-shadow: 0 0 6px var(--red); }
  .cents-label.flat  { color: var(--amber); text-shadow: 0 0 6px var(--amber); }

  .history-wrap { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); }
  .history-label { font-size: 9px; color: var(--text-muted); margin-bottom: 5px; text-align: left; letter-spacing: 2px; text-transform: uppercase; }
  .history-bar { display: flex; gap: 2px; height: 20px; align-items: flex-end; }
  .history-bar .hbar { flex: 1; border-radius: 1px; min-height: 2px; transition: height 0.1s, background 0.15s; }

  /* ── Controls ── */
  .controls-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    margin-bottom: 15px;
    position: relative;
  }
  .controls-card::before {
    content: '[ SETTINGS ]';
    position: absolute;
    top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px;
    color: var(--text-muted);
  }
  .ctrl-row { display: flex; align-items: center; gap: 10px; }
  .ctrl-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; min-width: 80px; letter-spacing: 1px; text-transform: uppercase; }
  .ctrl-row input[type=range] { flex: 1; accent-color: var(--green); }
  .ctrl-val { font-size: 12px; color: var(--text); min-width: 32px; text-align: right; }

  /* ── Buttons ── */
  .start-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 11px;
    font-family: var(--font);
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .start-btn:active { transform: scale(0.98); }
  .start-btn.active {
    border-color: var(--green);
    color: var(--text);
    background: var(--green-glow);
    text-shadow: 0 0 6px var(--green);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .dot.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green), 0 0 12px var(--green);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ── Looper ── */
  .looper-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 0.625rem;
    margin-bottom: 15px;
    position: relative;
    box-shadow: 0 0 15px var(--green-glow);
  }
  .looper-card::before {
    content: '[ LOOPER ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-dim);
  }
  .looper-status { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 6px; min-height: 16px; }
  .looper-status.recording { color: var(--red); text-shadow: 0 0 6px var(--red); animation: blink 0.6s linear infinite; }
  .looper-status.playing { color: var(--text); text-shadow: 0 0 6px var(--green); }
  .looper-status.processing { color: var(--text-muted); }
  .looper-status.stretching { color: var(--amber); }
  canvas.looper-waveform { width: 100%; height: 44px; border-radius: 2px; background: #050a03; border: 1px solid var(--border); margin-bottom: 10px; display: block; }
  .loop-progress-wrap { height: 2px; background: var(--surface2); margin-bottom: 8px; overflow: hidden; }
  .loop-progress-bar { height: 100%; width: 0%; background: var(--green); box-shadow: 0 0 4px var(--green); transition: width 0.05s linear; }

  .looper-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
  .lbtn {
    padding: 9px 8px 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: var(--font);
    cursor: pointer;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .lbtn:active { transform: scale(0.96); }
  .lbtn .licon { font-size: 18px; line-height: 1; }
  .lbtn .llabel { font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .lbtn.rec-active { border-color: var(--red); color: var(--red); background: rgba(255,59,59,0.1); text-shadow: 0 0 6px var(--red); }
  .lbtn.rec-active .llabel { color: var(--red); }
  .lbtn.play-active { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 6px var(--green); }
  .lbtn.play-active .llabel { color: var(--text-dim); }
  .lbtn:disabled { opacity: 0.2; pointer-events: none; }

  .loop-ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .loop-ctrl-row input[type=range] { flex: 1; accent-color: var(--green); }
  .loop-ctrl-label { font-size: 9px; color: var(--text-muted); white-space: nowrap; min-width: 90px; letter-spacing: 1px; text-transform: uppercase; }
  .loop-ctrl-val { font-size: 11px; color: var(--text); min-width: 40px; text-align: right; }

  /* ── Metronome ── */
  .metro-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.5rem 0.625rem;
    margin-top: 15px;
    position: relative;
  }
  .metro-card::before {
    content: '[ METRONOME ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-muted);
  }
  .metro-header { display: none; }
  .metro-title { display: none; }
  .metro-toggle {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .metro-toggle.on { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 6px var(--green); }
  .metro-step-btn {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 16px;
    cursor: pointer; transition: all 0.12s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .metro-step-btn:active { color: var(--text); border-color: var(--green); transform: scale(0.9); }
  .metro-bpm-row { display: flex; align-items: center; gap: 5px; margin-bottom: 9px; }
  .metro-bpm-row input[type=range] { flex: 1; accent-color: var(--green); min-width: 0; }
  .metro-bpm-val { font-size: 24px; min-width: 44px; text-align: right; text-shadow: 0 0 10px var(--green); letter-spacing: -1px; }
  .metro-bpm-unit { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
  .metro-sig-row { display: flex; gap: 5px; margin-bottom: 9px; }
  .metro-sig-btn {
    flex: 1; padding: 6px 4px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 11px; letter-spacing: 0.5px;
    cursor: pointer; text-align: center; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .metro-sig-btn.active { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 5px var(--green); }
  .metro-beats { display: flex; gap: 8px; justify-content: center; }
  .metro-beat {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1px solid var(--text-muted);
    background: transparent;
    transition: all 0.05s;
  }
  .metro-beat.accent { border-color: var(--text-dim); }
  .metro-beat.lit {
    background: var(--green) !important;
    border-color: var(--green) !important;
    box-shadow: 0 0 8px var(--green), 0 0 16px var(--green-glow) !important;
    transform: scale(1.3);
  }
  .metro-muted-note { font-size: 9px; color: var(--red); text-align: center; margin-top: 5px; min-height: 10px; letter-spacing: 1px; text-transform: uppercase; }

  /* ── Trainer ── */
  .trainer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.5rem 0.625rem;
    margin-top: 15px;
    position: relative;
  }
  .trainer-card::before {
    content: '[ BPM TRAINER ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-muted);
  }
  .trainer-header { display: none; }
  .trainer-title { display: none; }
  .trainer-toggle {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-family: var(--font);
    font-size: 13px;
    cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .trainer-toggle.on { border-color: var(--red); color: var(--red); background: rgba(255,59,59,0.1); text-shadow: 0 0 6px var(--red); }
  .trainer-row { display: flex; align-items: center; gap: 5px; margin-bottom: 9px; }
  .trainer-row:last-child { margin-bottom: 0; }
  .trainer-row input[type=range] { flex: 1; accent-color: var(--green); }
  .trainer-lbl { font-size: 9px; color: var(--text-muted); white-space: nowrap; min-width: 68px; letter-spacing: 1px; text-transform: uppercase; }
  .trainer-val { font-size: 12px; color: var(--text); min-width: 36px; text-align: right; white-space: nowrap; }
  .trainer-step-row { display: flex; align-items: center; gap: 0; margin-bottom: 9px; }
  .trainer-step-lbl { font-size: 9px; color: var(--text-muted); min-width: 68px; letter-spacing: 1px; text-transform: uppercase; }
  .step-btn {
    width: 34px; height: 34px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.1s; -webkit-tap-highlight-color: transparent;
  }
  .step-btn:active { transform: scale(0.9); color: var(--text); border-color: var(--green); }
  .step-val-box { font-size: 18px; min-width: 48px; text-align: center; color: var(--text); text-shadow: 0 0 6px var(--green); }
  .trainer-status { font-size: 9px; color: var(--text-dim); text-align: center; min-height: 12px; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

  /* ── Chord Finder ── */
  .chord-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 1.5rem 1rem 1.25rem;
    margin-bottom: 15px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 0 20px var(--green-glow);
  }
  .chord-card::before {
    content: '[ CHORD DETECT ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-dim);
  }
  .chord-main {
    font-size: 64px; font-family: var(--font); font-weight: normal;
    line-height: 1; letter-spacing: -2px;
    color: var(--text);
    text-shadow: 0 0 20px var(--green), 0 0 40px rgba(57,255,20,0.2);
    min-height: 70px;
  }
  .chord-sub  { font-size: 11px; color: var(--text-dim); margin-top: 6px; min-height: 20px; letter-spacing: 1px; text-transform: uppercase; }
  .chord-notes { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; min-height: 26px; }
  .chord-note-pill {
    font-size: 10px; font-family: var(--font); letter-spacing: 1px;
    padding: 3px 8px; border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-dim);
  }
  .chord-note-pill.root { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 4px var(--green); }
  .chord-aliases { font-size: 10px; color: var(--text-muted); margin-top: 8px; min-height: 18px; letter-spacing: 1px; }
  .chord-bars-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    margin-bottom: 15px;
  }
  canvas.chord-spectrum { width: 100%; height: 50px; display: block; border-radius: 2px; margin-bottom: 8px; background: #050a03; border: 1px solid var(--border); }
  .chord-bars { display: flex; gap: 3px; height: 36px; align-items: flex-end; }
  .chord-bar  { flex: 1; border-radius: 1px; min-height: 2px; background: var(--text-muted); transition: height 0.1s, background 0.15s; }
  .chord-bar.active { background: var(--text-dim); box-shadow: 0 0 4px var(--green-glow); }
  .chord-bar.root   { background: var(--text); box-shadow: 0 0 6px var(--green); }
  .chord-ctrl-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 0.75rem;
  }

  /* ── Custom ── */

  .apply-btn {

</style>

<script>
// ════════════════════════════════════════════════
//  SHARED
// ════════════════════════════════════════════════
function switchTab(id, btn) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + id).classList.add("active");
  btn.classList.add("active");
}

// ════════════════════════════════════════════════
//  TUNER
// ════════════════════════════════════════════════
const TUNINGS = {
  "Standard": ["E2","A2","D3","G3","B3","E4"],
  "Drop D":   ["D2","A2","D3","G3","B3","E4"],
  "Open G":   ["D2","G2","D3","G3","B3","D4"],
  "DADGAD":   ["D2","A2","D3","G3","A3","D4"],
  "Open E":   ["E2","B2","E3","G#3","B3","E4"],
};
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const STRING_LABELS = ["6th","5th","4th","3rd","2nd","1st"];
const HISTORY_SIZE = 20;

function noteToFreq(note) {
  const m = note.match(/^([A-G]#?)(\d)$/);
  if (!m) return null;
  const n = NOTE_NAMES.indexOf(m[1]);
  if (n < 0) return null;
  return 440 * Math.pow(2, ((parseInt(m[2]) + 1) * 12 + n - 69) / 12);
}

function freqToNote(freq) {
  if (freq <= 0) return { name: "—", cents: 0 };
  const midi = 12 * Math.log2(freq / 440) + 69;
  const midiR = Math.round(midi);
  return {
    name: NOTE_NAMES[((midiR % 12) + 12) % 12] + (Math.floor(midiR / 12) - 1),
    cents: Math.round((midi - midiR) * 100)
  };
}

let tunings = JSON.parse(JSON.stringify(TUNINGS));
let currentTuning = "Standard", selectedString = 0;
let tunerCtx = null, analyser = null, tunerRaf = null, micStream = null, tunerOn = false;
let centsHistory = [], lastHistoryTime = 0;

const tuningsRow   = document.getElementById("tunings-row");
const stringsGrid  = document.getElementById("strings-grid");
const detectedNote = document.getElementById("detected-note");
const detectedFreq = document.getElementById("detected-freq");
const needle       = document.getElementById("needle");
const centsLabel   = document.getElementById("cents-label");
const startBtn     = document.getElementById("start-btn");
const dotEl        = document.getElementById("dot");
const btnLabel     = document.getElementById("btn-label");
const historyBar   = document.getElementById("history-bar");
const sensitivitySlider = document.getElementById("sensitivity");

for (let i = 0; i < HISTORY_SIZE; i++) {
  const b = document.createElement("div"); b.className = "hbar";
  b.style.cssText = "background:#eee;height:3px"; historyBar.appendChild(b);
}

function getRmsThreshold() { return 0.055 - (parseInt(sensitivitySlider.value) - 1) * 0.005; }

function updateHistory(diff, inTune) {
  centsHistory.push({ diff, inTune });
  if (centsHistory.length > HISTORY_SIZE) centsHistory.shift();
  const bars = historyBar.querySelectorAll(".hbar");
  const offset = HISTORY_SIZE - centsHistory.length;
  bars.forEach((bar, i) => {
    const idx = i - offset;
    if (idx < 0) { bar.style.height = "3px"; bar.style.background = "#eee"; return; }
    const e = centsHistory[idx];
    bar.style.height = (3 + (Math.min(Math.abs(e.diff), 50) / 50) * 17).toFixed(1) + "px";
    bar.style.background = e.inTune ? "#1D9E75" : (e.diff > 0 ? "#E57368" : "#378ADD");
  });
}

function resetHistory() {
  centsHistory = [];
  historyBar.querySelectorAll(".hbar").forEach(b => { b.style.height = "3px"; b.style.background = "#eee"; });
}

function buildTuningBtns() {
  tuningsRow.innerHTML = "";
  Object.keys(tunings).forEach(name => {
    const b = document.createElement("button");
    b.className = "tuning-btn" + (name === currentTuning ? " active" : "");
    b.textContent = name;
    b.onclick = () => { currentTuning = name; selectedString = 0; 
// Splash title fade
setTimeout(() => {
  const t = document.getElementById("splash-title");
  if (t) t.classList.add("hidden");
}, 1500);

buildTuningBtns(); buildStringBtns(); buildCustomInputs(); resetHistory(); };
    tuningsRow.appendChild(b);
  });
}

function buildStringBtns() {
  stringsGrid.innerHTML = "";
  tunings[currentTuning].forEach((note, i) => {
    const freq = noteToFreq(note);
    const b = document.createElement("button");
    b.className = "string-btn" + (i === selectedString ? " selected" : "");
    b.innerHTML = `<div class="note">${note}</div><div class="freq">${STRING_LABELS[i]} — ${freq ? freq.toFixed(1) : "?"}Hz</div>`;
    b.onclick = () => { selectedString = i; buildStringBtns(); resetHistory(); };
    stringsGrid.appendChild(b);
  });
}

function buildCustomInputs() {
  const div = document.getElementById("custom-inputs"); div.innerHTML = "";
  tunings[currentTuning].forEach((note, i) => {
    const inp = document.createElement("input");
    inp.value = note; inp.placeholder = "es. E2"; inp.dataset.idx = i;
    div.appendChild(inp);
  });
}

document.getElementById("apply-btn").onclick = () => {
  const inputs = document.getElementById("custom-inputs").querySelectorAll("input");
  const newNotes = Array.from(inputs).map(i => i.value.trim());
  if (newNotes.some(n => noteToFreq(n) === null)) { alert("Invalid note! Use format like E2, G#3…"); return; }
  tunings["Custom"] = newNotes;
  currentTuning = "Custom"; selectedString = 0;
  
// Splash title fade
setTimeout(() => {
  const t = document.getElementById("splash-title");
  if (t) t.classList.add("hidden");
}, 1500);

buildTuningBtns(); buildStringBtns(); buildCustomInputs(); resetHistory();
};

// ── Canvas gauge ───────────────────────────────
const gaugeCanvas = document.getElementById("gauge-canvas");
const gaugeCtx    = gaugeCanvas.getContext("2d");
let gaugeNeedleAngle = -Math.PI / 2; // starts center
let gaugeTargetAngle = -Math.PI / 2;
let gaugeInTune = false;
let gaugeAnimRaf = null;

function resizeGauge() {
  const w = gaugeCanvas.offsetWidth;
  gaugeCanvas.width = w * window.devicePixelRatio;
  gaugeCanvas.height = 80 * window.devicePixelRatio;
  gaugeCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  drawGauge();
}

function drawGauge() {
  const w = gaugeCanvas.offsetWidth, h = 100;
  gaugeCtx.fillStyle = '#0a0f06'; gaugeCtx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h - 10, r = Math.min(w * 0.42, 78);

  // Arc track
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, r, Math.PI * 1.2, Math.PI * 1.8, false);  // wider arc -75 to +75 deg mapped to PI range
  gaugeCtx.strokeStyle = "#0d2a08";
  gaugeCtx.lineWidth = 8;
  gaugeCtx.lineCap = "round";
  gaugeCtx.stroke();

  // Colored zones
  // Flat zone (left)
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, r, Math.PI * 1.2, Math.PI * 1.5, false);
  gaugeCtx.strokeStyle = "rgba(255,176,0,0.4)";
  gaugeCtx.lineWidth = 8;
  gaugeCtx.stroke();

  // Sharp zone (right)
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, r, Math.PI * 1.5, Math.PI * 1.8, false);
  gaugeCtx.strokeStyle = "rgba(255,59,59,0.4)";
  gaugeCtx.lineWidth = 8;
  gaugeCtx.stroke();

  // In-tune zone center
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, r, Math.PI * 1.46, Math.PI * 1.54, false);
  gaugeCtx.strokeStyle = gaugeInTune ? "rgba(57,255,20,1)" : "rgba(57,255,20,0.4)";
  gaugeCtx.lineWidth = 8;
  gaugeCtx.stroke();

  // Tick marks
  for (let i = -5; i <= 5; i++) {
    const angle = Math.PI * 1.5 + (i / 5) * Math.PI * 0.3;
    const isMajor = i % 5 === 0;
    const r1 = r + 4, r2 = r + (isMajor ? 10 : 6);
    gaugeCtx.beginPath();
    gaugeCtx.moveTo(cx + r1 * Math.cos(angle), cy + r1 * Math.sin(angle));
    gaugeCtx.lineTo(cx + r2 * Math.cos(angle), cy + r2 * Math.sin(angle));
    gaugeCtx.strokeStyle = isMajor ? "#1a7a0a" : "#0d3a06";
    gaugeCtx.lineWidth = isMajor ? 1.5 : 1;
    gaugeCtx.stroke();
  }

  // Needle
  const needleLen = r - 6;
  const nx = cx + needleLen * Math.cos(gaugeNeedleAngle);
  const ny = cy + needleLen * Math.sin(gaugeNeedleAngle);
  // Shadow
  gaugeCtx.beginPath();
  gaugeCtx.moveTo(cx, cy);
  gaugeCtx.lineTo(nx, ny);
  gaugeCtx.strokeStyle = "rgba(57,255,20,0.08)";
  gaugeCtx.lineWidth = 5;
  gaugeCtx.lineCap = "round";
  gaugeCtx.stroke();
  // Needle body
  gaugeCtx.beginPath();
  gaugeCtx.moveTo(cx, cy);
  gaugeCtx.lineTo(nx, ny);
  gaugeCtx.strokeStyle = gaugeInTune ? "#39ff14" : "#39ff14";
  gaugeCtx.lineWidth = 2.5;
  gaugeCtx.stroke();
  // Pivot
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, 5, 0, Math.PI * 2);
  gaugeCtx.fillStyle = "#39ff14";
  gaugeCtx.fill();
  // Pivot inner
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, 2.5, 0, Math.PI * 2);
  gaugeCtx.fillStyle = "#0a0f06";
  gaugeCtx.fill();
}

function animateGauge() {
  const diff = gaugeTargetAngle - gaugeNeedleAngle;
  if (Math.abs(diff) > 0.001) {
    gaugeNeedleAngle += diff * 0.18;
    drawGauge();
    gaugeAnimRaf = requestAnimationFrame(animateGauge);
  } else {
    gaugeNeedleAngle = gaugeTargetAngle;
    drawGauge();
    gaugeAnimRaf = null;
  }
}

function setNeedle(cents) {
  const clamped = Math.max(-50, Math.min(50, cents));
  // Map -50..+50 to PI*1.2..PI*1.8
  gaugeTargetAngle = Math.PI * 1.5 + (clamped / 50) * Math.PI * 0.3;
  if (!gaugeAnimRaf) gaugeAnimRaf = requestAnimationFrame(animateGauge);
}

resizeGauge();
window.addEventListener("resize", resizeGauge);

function autoCorrelate(buf, sr) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < getRmsThreshold()) return -1;
  let r1 = 0, r2 = SIZE - 1;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < 0.2) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < 0.2) { r2 = SIZE - i; break; }
  buf = buf.slice(r1, r2);
  const n = buf.length, c = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) c[i] += buf[j] * buf[j + i];
  let d = 0; while (c[d] > c[d + 1]) d++;
  let mx = -1, mp = -1;
  for (let i = d; i < n; i++) if (c[i] > mx) { mx = c[i]; mp = i; }
  const x1 = c[mp-1], x2 = c[mp], x3 = c[mp+1];
  const a = (x1 + x3 - 2*x2)/2, b2 = (x3-x1)/2;
  let T0 = mp; if (a) T0 -= b2/(2*a);
  return sr / T0;
}

function tunerUpdate(ts) {
  if (!analyser) return;
  tunerRaf = requestAnimationFrame(tunerUpdate);
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, tunerCtx.sampleRate);
  if (freq > 60 && freq < 1400) {
    const { name, cents } = freqToNote(freq);
    detectedNote.textContent = name;
    detectedFreq.textContent = freq.toFixed(1) + " Hz";
    setNeedle(cents);
    const tf = noteToFreq(tunings[currentTuning][selectedString]);
    let inTune = false, diff = cents;
    if (tf) {
      diff = Math.round(1200 * Math.log2(freq / tf));
      if (Math.abs(diff) <= 5) { centsLabel.textContent = "✓ In tune!"; centsLabel.className = "cents-label in-tune"; inTune = true; gaugeInTune = true; detectedNote.classList.add("in-tune"); }
      else if (diff > 5) { centsLabel.textContent = `+${diff} cents — lower`; centsLabel.className = "cents-label sharp"; gaugeInTune = false; detectedNote.classList.remove("in-tune"); }
      else { centsLabel.textContent = `${diff} cents — raise`; centsLabel.className = "cents-label flat"; gaugeInTune = false; detectedNote.classList.remove("in-tune"); }
    }
    if (!lastHistoryTime || ts - lastHistoryTime > 100) { lastHistoryTime = ts; updateHistory(diff, inTune); }
  }
}

startBtn.onclick = async () => {
  if (tunerOn) {
    tunerOn = false;
    if (tunerRaf) cancelAnimationFrame(tunerRaf);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (tunerCtx) tunerCtx.close();
    analyser = tunerCtx = micStream = null;
    dotEl.className = "dot"; btnLabel.textContent = "Start microphone"; startBtn.className = "start-btn";
    centsLabel.textContent = "select a string and start"; centsLabel.className = "cents-label";
    detectedNote.textContent = "—"; detectedFreq.textContent = "0.0 Hz"; setNeedle(0); resetHistory();
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    tunerCtx = new (window.AudioContext || window.webkitAudioContext)();

let loopStretchDebounce = null;
let loopStretchPending = false;
let loopSpeedPending = 1.0;

function setLoopSpeed(v) {
  loopSpeed = parseInt(v) / 100;
  loopSpeedVal.textContent = v + "%";
  if (!loopBuffer) return;
  // Debounce: wait 300ms after slider stops moving, then stretch in background
  clearTimeout(loopStretchDebounce);
  loopSpeedPending = loopSpeed;
  loopStretchDebounce = setTimeout(() => applyStretchInBackground(loopSpeedPending), 300);
}

function applyStretchInBackground(rate) {
  if (!loopBuffer) return;
  loopStretchPending = true;
  // Show subtle indicator without stopping playback
  const origStatus = looperStatus.textContent;
  looperStatus.textContent = "↻ Adjusting speed…";

  // Run WSOLA in a micro-task so the UI stays responsive
  setTimeout(() => {
    const newBuf = wsola(loopBuffer, rate);
    loopStretchedBuffer = newBuf;
    loopStretchPending = false;

    // Seamless swap: if playing, wait for current loop end then swap
    if (loopState === "playing") {
      swapLoopBuffer(newBuf);
    }
    looperStatus.textContent = loopBuffer
      ? (loopState === "playing"
          ? "▶ Loop — " + Math.round(rate*100) + "%"
          : "Sample ready — " + loopBuffer.duration.toFixed(2) + "s")
      : "Press REC to start";
    looperStatus.className = loopState === "playing" ? "looper-status playing" : "looper-status";
  }, 10);
}

function swapLoopBuffer(newBuf) {
  if (!loopCtx || loopState !== "playing") return;
  // Calculate position in current loop cycle
  const elapsed = (loopCtx.currentTime - loopStartTime) % loopDuration;
  const progress = elapsed / loopDuration;
  const newDuration = newBuf.duration;
  const newStartOffset = progress * newDuration;

  // Stop old source silently
  if (loopSource) { try { loopSource.stop(); } catch(e) {} loopSource = null; }

  // Start new source at equivalent position
  loopSource = loopCtx.createBufferSource();
  loopSource.buffer = newBuf;
  loopSource.loop = true;
  loopSource.connect(loopGain);
  loopSource.start(0, newStartOffset);

  loopDuration = newDuration;
  loopStartTime = loopCtx.currentTime - newStartOffset;
}

async function ensureLoopCtx() {
  if (loopCtx) return true;
  try {
    loopStream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: false,

// ── Trim silence + crossfade ──────────────────
function trimAndCrossfade(buffer) {
  const sr = buffer.sampleRate, ch = buffer.numberOfChannels;
  const data = [];
  for (let i = 0; i < ch; i++) data.push(buffer.getChannelData(i));
  const THRESH = 0.02, FRAME = 256, len = data[0].length;
  let startS = 0, endS = len;
  for (let i = 0; i < len - FRAME; i += FRAME) {
    let rms = 0; for (let j = 0; j < FRAME; j++) rms += data[0][i+j]**2;
    if (Math.sqrt(rms/FRAME) > THRESH) { startS = Math.max(0, i - FRAME); break; }
  }
  for (let i = len - FRAME; i > startS; i -= FRAME) {
    let rms = 0; for (let j = 0; j < FRAME; j++) rms += data[0][i+j]**2;
    if (Math.sqrt(rms/FRAME) > THRESH) { endS = Math.min(len, i + FRAME*2); break; }
  }
  const trimLen = endS - startS;
  if (trimLen < sr * 0.1) return buffer;
  const xfLen = Math.min(Math.floor(sr * 0.03), Math.floor(trimLen * 0.1));
  const out = loopCtx.createBuffer(ch, trimLen, sr);
  for (let c2 = 0; c2 < ch; c2++) {
    const src = data[c2], dst = out.getChannelData(c2);
    for (let i = 0; i < trimLen; i++) dst[i] = src[startS + i];
    for (let i = 0; i < xfLen; i++) {
      const t = i / xfLen;
      dst[i] = dst[i] * t + dst[trimLen - xfLen + i] * (1 - t);
    }
    for (let i = trimLen - xfLen; i < trimLen; i++) {
      dst[i] = dst[i] * (1 - (i - (trimLen - xfLen)) / xfLen);
    }
  }
  return out;
}

// ── WSOLA time-stretch (pitch-preserving) ─────
// Returns a new AudioBuffer stretched to targetRate (0.25–1.0)
function wsola(buffer, rate) {
  if (Math.abs(rate - 1.0) < 0.01) return buffer;

  const sr = buffer.sampleRate;
  const ch = buffer.numberOfChannels;
  const inLen = buffer.length;
  const outLen = Math.round(inLen / rate);

  // Parameters tuned for guitar (200ms frames, 25ms hop)
  const frameSize = Math.round(sr * 0.08);   // 80ms analysis frame
  const hopOut    = Math.round(sr * 0.02);   // 20ms output hop
  const hopIn     = Math.round(hopOut * rate); // scaled input hop

  const outBuf = loopCtx.createBuffer(ch, outLen, sr);

  for (let c2 = 0; c2 < ch; c2++) {
    const inp = buffer.getChannelData(c2);
    const out = outBuf.getChannelData(c2);
    // Hann window
    const win = new Float32Array(frameSize);
    for (let i = 0; i < frameSize; i++) win[i] = 0.5 * (1 - Math.cos(2*Math.PI*i/(frameSize-1)));

    let inPos = 0;   // read cursor in input
    let outPos = 0;  // write cursor in output

    while (outPos + frameSize < outLen && inPos + frameSize < inLen) {
      // Find best match near inPos via cross-correlation in a search window
      const searchRadius = Math.round(hopIn * 0.5);
      const searchStart = Math.max(0, inPos - searchRadius);
      const searchEnd   = Math.min(inLen - frameSize, inPos + searchRadius);

      let bestOffset = inPos;
      let bestCorr = -Infinity;

      // Reference: frame at previous inPos (already written region mapped back)
      // Use the last written output frame as reference
      const refStart = Math.max(0, outPos - hopOut);
      const refLen   = Math.min(frameSize, outPos - refStart);

      if (refLen > 16) {
        for (let s = searchStart; s <= searchEnd; s += 4) { // stride 4 for speed
          let corr = 0;
          for (let k = 0; k < refLen; k++) corr += out[refStart + k] * (inp[s + k] || 0);
          if (corr > bestCorr) { bestCorr = corr; bestOffset = s; }
        }
      } else {
        bestOffset = inPos;
      }

      // OLA: add windowed frame at bestOffset into output at outPos
      for (let k = 0; k < frameSize && outPos + k < outLen && bestOffset + k < inLen; k++) {
        out[outPos + k] += inp[bestOffset + k] * win[k];
      }

      inPos  = bestOffset + hopIn;
      outPos += hopOut;
    }

    // Normalize to remove OLA gain artifacts
    // Find peak
    let peak = 0;
    for (let i = 0; i < outLen; i++) if (Math.abs(out[i]) > peak) peak = Math.abs(out[i]);
    if (peak > 0.01) { const scale = Math.min(1.0, 0.95 / peak); for (let i = 0; i < outLen; i++) out[i] *= scale; }
  }

  return outBuf;
}

async function looperRec() {
  if (loopState === "recording") return;
  if (loopState === "playing") looperStop();
  if (!await ensureLoopCtx()) return;

  // Auto-mute metronomo
  metroMuteForRec(true);

  recordedChunks = []; loopBuffer = null; loopStretchedBuffer = null;
  drawWaveform(null); loopProgress.style.width = "0%";

  mediaRecorder = new MediaRecorder(loopStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    metroMuteForRec(false);
    looperStatus.textContent = "Processing…"; looperStatus.className = "looper-status processing";
    const blob = new Blob(recordedChunks, { type: "audio/webm" });
    const raw = await loopCtx.decodeAudioData(await blob.arrayBuffer());
    loopBuffer = trimAndCrossfade(raw);
    loopStretchedBuffer = loopSpeed < 0.99 ? wsola(loopBuffer, loopSpeed) : loopBuffer;
    loopDuration = loopStretchedBuffer.duration;
    drawWaveform(loopBuffer);
    looperStatus.textContent = `Sample ready — ${loopBuffer.duration.toFixed(2)}s`;
    looperStatus.className = "looper-status";
    lbtnPlay.disabled = false; lbtnClear.disabled = false; lbtnRec.classList.remove("rec-active");
    loopSpeedSlider.disabled = false;
  };

  mediaRecorder.start();
  loopState = "recording";
  looperStatus.textContent = "● Recording…"; looperStatus.className = "looper-status recording";
  lbtnRec.classList.add("rec-active"); lbtnStop.disabled = false; lbtnPlay.disabled = true;
}

function looperPlay() {
  if (!loopStretchedBuffer || loopState === "recording") return;
  if (loopState === "playing") { looperStop(); return; }

  loopGain = loopCtx.createGain();
  loopGain.gain.value = parseInt(loopVolSlider.value) / 100;
  loopCompressor = loopCtx.createDynamicsCompressor();
  loopCompressor.threshold.value = -24;
  loopCompressor.knee.value = 10;
  loopCompressor.ratio.value = 4;
  loopCompressor.attack.value = 0.003;
  loopCompressor.release.value = 0.1;
  loopGain.connect(loopCompressor);
  loopCompressor.connect(loopCtx.destination);

  loopSource = loopCtx.createBufferSource();
  loopSource.buffer = loopStretchedBuffer;
  loopSource.loop = true;
  loopSource.connect(loopGain);
  loopSource.start();
  loopStartTime = loopCtx.currentTime; loopDuration = loopStretchedBuffer.duration;
  loopState = "playing";
  looperStatus.textContent = `▶ Loop — ${Math.round(loopSpeed*100)}%`; looperStatus.className = "looper-status playing";
  lbtnPlay.classList.add("play-active"); lbtnPlay.querySelector(".licon").textContent = "⏸";
  lbtnStop.disabled = false;
  animateProgress();
}

function looperStop() {
  if (loopSource) { try { loopSource.stop(); } catch(e) {} loopSource = null; }
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  if (loopAnimRaf) { cancelAnimationFrame(loopAnimRaf); loopAnimRaf = null; }
  loopState = "idle"; loopProgress.style.width = "0%";
  looperStatus.textContent = loopBuffer ? `Sample ready — ${loopBuffer.duration.toFixed(2)}s` : "Press REC to start";
  looperStatus.className = "looper-status";
  lbtnPlay.classList.remove("play-active"); lbtnPlay.querySelector(".licon").textContent = "▶";
  lbtnRec.classList.remove("rec-active"); lbtnStop.disabled = true;
  if (loopBuffer) { lbtnPlay.disabled = false; lbtnClear.disabled = false; }
}

function looperClear() {
  looperStop();
  loopBuffer = null; loopStretchedBuffer = null; loopDuration = 0;
  loopSpeedSlider.value = 100; loopSpeedVal.textContent = "100%"; loopSpeed = 1.0; loopSpeedSlider.disabled = true;
  drawWaveform(null);
  looperStatus.textContent = "Press REC to start"; looperStatus.className = "looper-status";
  lbtnPlay.disabled = true; lbtnClear.disabled = true; lbtnStop.disabled = true;
}

function animateProgress() {
  if (loopState !== "playing") return;
  const elapsed = (loopCtx.currentTime - loopStartTime) % loopDuration;
  loopProgress.style.width = ((elapsed / loopDuration) * 100).toFixed(1) + "%";
  loopAnimRaf = requestAnimationFrame(animateProgress);
}

function drawWaveform(buffer) {
  const w = loopCanvas.offsetWidth || 300, h = 60;
  loopCanvas.width = w; loopCanvas.height = h;
  loopCtx2d.fillStyle = "#050a03"; loopCtx2d.fillRect(0, 0, w, h);
  if (!buffer) {
    loopCtx2d.strokeStyle = "#1a7a0a"; loopCtx2d.lineWidth = 1;
    loopCtx2d.beginPath(); loopCtx2d.moveTo(0, h/2); loopCtx2d.lineTo(w, h/2); loopCtx2d.stroke();
    return;
  }
  const data = buffer.getChannelData(0), step = Math.ceil(data.length / w);
  loopCtx2d.strokeStyle = "#39ff14"; loopCtx2d.lineWidth = 1.5; loopCtx2d.beginPath();
  for (let i = 0; i < w; i++) {
    let mn = 1, mx = -1;
    for (let j = 0; j < step; j++) { const v = data[i*step+j]||0; if(v<mn)mn=v; if(v>mx)mx=v; }
    const y1 = ((1+mn)/2)*h, y2 = ((1+mx)/2)*h;
    if (i===0) loopCtx2d.moveTo(i,y1); else loopCtx2d.lineTo(i,y1);
    loopCtx2d.lineTo(i,y2);
  }
  loopCtx2d.stroke();
}

drawWaveform(null);

let metroBpm = 120, metroBeats = 4;
let metroRunning = false, metroMuted = false;
let metroNextTime = 0, metroCurBeat = 0, metroSchedulerId = null;
let metroCtx = null;

const metroToggleBtn = document.getElementById("metro-toggle");
const metroBpmValEl  = document.getElementById("metro-bpm-val");
const metroBeatsEl   = document.getElementById("metro-beats");
const metroMutedNote = document.getElementById("metro-muted-note");

function buildMetroBeats() {
  metroBeatsEl.innerHTML = "";
  for (let i = 0; i < metroBeats; i++) {
    const d = document.createElement("div");
    d.className = "metro-beat" + (i===0?" accent":"");
    metroBeatsEl.appendChild(d);
  }
}
buildMetroBeats();

function metroBpmChange(v) { metroBpm = parseInt(v); metroBpmValEl.textContent = metroBpm; }
function metroAdjBpm(delta) {
  metroBpm = Math.max(40, Math.min(240, metroBpm + delta));
  document.getElementById("metro-bpm").value = metroBpm;
  metroBpmValEl.textContent = metroBpm;
}

function metroSig(beats, btn) {
  document.querySelectorAll(".metro-sig-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active"); metroBeats = beats; metroCurBeat = 0; buildMetroBeats();
}

function ensureMetroCtx() {
  if (!metroCtx) metroCtx = loopCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (metroCtx.state === "suspended") metroCtx.resume();
}

function metroSchedule() {
  if (!metroRunning) return;
  ensureMetroCtx();
  const interval = 60 / metroBpm;
  while (metroNextTime < metroCtx.currentTime + 0.1) {
    scheduleTick(metroNextTime, metroCurBeat);
    metroNextTime += interval;
    metroCurBeat = (metroCurBeat + 1) % metroBeats;
  }
  metroSchedulerId = setTimeout(metroSchedule, 25);
}

function scheduleTick(time, beat) {
  const isAccent = beat === 0;
  if (!metroMuted) {
    const osc = metroCtx.createOscillator(), env = metroCtx.createGain();
    osc.connect(env); env.connect(metroCtx.destination);
    osc.frequency.value = isAccent ? 1000 : 700;
    env.gain.setValueAtTime(isAccent ? 0.6 : 0.35, time);
    env.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
    osc.start(time); osc.stop(time + 0.05);
  }
  const delay = Math.max(0, (time - metroCtx.currentTime) * 1000);
  setTimeout(() => { flashBeat(beat); trainerOnBeat(); }, delay);
}

function flashBeat(beat) {
  const dots = metroBeatsEl.querySelectorAll(".metro-beat");
  dots.forEach((d, i) => d.classList.toggle("lit", i === beat));
  clearTimeout(flashBeat._off);
  flashBeat._off = setTimeout(() => dots.forEach(d => d.classList.remove("lit")), 80);
}

function metroMuteForRec(mute) {
  metroMuted = mute;
  metroMutedNote.textContent = mute ? "🔇 Audio muted during recording" : "";
}

function metroToggle() {
  if (metroRunning) {
    metroRunning = false; clearTimeout(metroSchedulerId);
    metroBeatsEl.querySelectorAll(".metro-beat").forEach(d => d.classList.remove("lit"));
    metroToggleBtn.textContent = "▶"; metroToggleBtn.className = "metro-toggle";
  } else {
    ensureMetroCtx();
    metroRunning = true; metroCurBeat = 0;
    metroNextTime = metroCtx.currentTime + 0.05;
    metroToggleBtn.textContent = "⏹"; metroToggleBtn.className = "metro-toggle on";
    metroSchedule();
  }
}

let trainerRunning = false;
let trainerStep = 2;          // BPM per scatto
let trainerPeriod = 4;        // beatstute per scatto
let trainerTarget = 160;
let trainerBeatCount = 0;     // contatore beatstiti dall'ultimo scatto
let trainerStartBpm = 120;

const trainerToggleBtn  = document.getElementById("trainer-toggle");

function trainerPeriodChange(v) {

function trainerPeriodAdj(delta) {

function trainerToggle() {

    trainerBeatCount = 0;

    trainerToggleBtn.className = "trainer-toggle on";
    trainerUpdateStatus();
  }
}

function trainerUpdateStatus() {
  if (!trainerRunning) return;
  const remaining = trainerPeriod - (trainerBeatCount % trainerPeriod);
  trainerStatusEl.textContent = metroBpm + " BPM → target " + trainerTarget + " | next step in " + remaining + " bt";
}

// Agganciato al tick del metronomo — chiamato da scheduleTick su beat 0 di ogni misura
// ma contiamo ogni singolo beat per granularità
function trainerOnBeat() {
  if (!trainerRunning) return;
  trainerBeatCount++;
  if (trainerBeatCount % trainerPeriod === 0) {
    // Step increment
    const dir = trainerStep >= 0 ? 1 : -1;
    const newBpm = metroBpm + trainerStep;
    if ((trainerStep > 0 && newBpm >= trainerTarget) || (trainerStep < 0 && newBpm <= trainerTarget)) {
      // Raggiunto target
      metroBpm = trainerTarget;
      document.getElementById("metro-bpm").value = trainerTarget;
      metroBpmValEl.textContent = trainerTarget;
      trainerRunning = false;
      trainerToggleBtn.textContent = "Start";
      trainerToggleBtn.className = "trainer-toggle";
      trainerStatusEl.textContent = "✓ Target " + trainerTarget + " BPM reached!";
      return;
    }
    metroBpm = Math.max(40, Math.min(240, newBpm));
    document.getElementById("metro-bpm").value = metroBpm;
    metroBpmValEl.textContent = metroBpm;
  }
  trainerUpdateStatus();
}

const CHORD_NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

// Chord templates: [name, intervals from root]
// intervals are semitone offsets from root (mod 12)
const CHORD_TEMPLATES = [
  // Triads
  ["",        [0,4,7]],
  ["m",       [0,3,7]],
  ["dim",     [0,3,6]],
  ["aug",     [0,4,8]],
  ["sus2",    [0,2,7]],
  ["sus4",    [0,5,7]],
  // Sevenths
  ["maj7",    [0,4,7,11]],
  ["7",       [0,4,7,10]],
  ["m7",      [0,3,7,10]],
  ["mMaj7",   [0,3,7,11]],
  ["dim7",    [0,3,6,9]],
  ["m7b5",    [0,3,6,10]],
  ["aug7",    [0,4,8,10]],
  ["augMaj7", [0,4,8,11]],
  ["7sus4",   [0,5,7,10]],
  // Sixths
  ["6",       [0,4,7,9]],
  ["m6",      [0,3,7,9]],
  ["6/9",     [0,4,7,9,2]],
  // Ninths
  ["maj9",    [0,4,7,11,2]],
  ["9",       [0,4,7,10,2]],
  ["m9",      [0,3,7,10,2]],
  ["add9",    [0,4,7,2]],
  ["madd9",   [0,3,7,2]],
  ["9sus4",   [0,5,7,10,2]],
  // Elevenths
  ["11",      [0,4,7,10,2,5]],
  ["m11",     [0,3,7,10,2,5]],
  ["maj11",   [0,4,7,11,2,5]],
  // Thirteenths
  ["13",      [0,4,7,10,2,5,9]],
  ["maj13",   [0,4,7,11,2,5,9]],
  ["m13",     [0,3,7,10,2,5,9]],
  // Power
  ["5",       [0,7]],
];

// Build lookup: for every root × template → pitch class set
// Returns best match given a set of detected pitch classes
function matchChord(pcSet) {
  if (pcSet.size < 2) return null;
  let best = null, bestScore = -1;

  for (let root = 0; root < 12; root++) {
    for (const [name, intervals] of CHORD_TEMPLATES) {
      const chordPcs = new Set(intervals.map(i => (root + i) % 12));
      let matched = 0;
      for (const pc of chordPcs) if (pcSet.has(pc)) matched++;
      const coverage = matched / chordPcs.size;   // how much of chord is covered
      const precision = matched / pcSet.size;     // how many detected notes fit
      // Require good coverage AND precision — prevents large chords eating small sets
      if (matched < 2 || coverage < 0.65 || precision < 0.5) continue;
      // Bonus for perfect match, penalty for larger chords with same coverage
      const exactBonus = (matched === chordPcs.size && matched === pcSet.size) ? 0.15 : 0;
      const sizepenalty = chordPcs.size > pcSet.size ? (chordPcs.size - pcSet.size) * 0.04 : 0;
      const score = coverage * 0.55 + precision * 0.45 + exactBonus - sizepenalty;
      if (score > bestScore) {
        bestScore = score;
        best = { root, name, chordPcs, score, coverage, matched };
      }
    }
  }
  return best;
}

// Inversion/slash chord: bass note != root
function getSlashChord(match, bassPC) {
  if (bassPC === match.root) return null;
  const bassName = CHORD_NOTE_NAMES[bassPC];
  const rootName = CHORD_NOTE_NAMES[match.root];
  return rootName + match.name + "/" + bassName;
}

// Enharmonic aliases
const ENHARMONIC = { "C#":"Db","D#":"Eb","F#":"Gb","G#":"Ab","A#":"Bb" };
function enharmonic(n) { return ENHARMONIC[n] || null; }

let chordCtx = null, chordAnalyser = null, chordMicStream = null;
let chordRunning = false, chordRaf = null;
let chordSens = 5;

const chordStartBtn  = document.getElementById("chord-start-btn");
const chordDot       = document.getElementById("chord-dot");
const chordBtnLabel  = document.getElementById("chord-btn-label");
const chordMain      = document.getElementById("chord-main");
const chordSub       = document.getElementById("chord-sub");
const chordNotesEl   = document.getElementById("chord-notes");
const chordAliases   = document.getElementById("chord-aliases");
const chordBarsEl    = document.getElementById("chord-bars");
const chordSpecCanvas= document.getElementById("chord-spectrum");
const chordSpecCtx   = chordSpecCanvas.getContext("2d");

// Build 12 pitch class bars
for (let i = 0; i < 12; i++) {
  const b = document.createElement("div"); b.className = "chord-bar";
  const lbl = document.createElement("div");
  lbl.style.cssText = "font-size:9px;color:#aaa;text-align:center;margin-top:2px";
  lbl.textContent = CHORD_NOTE_NAMES[i];
  const wrap = document.createElement("div");
  wrap.style.cssText = "flex:1;display:flex;flex-direction:column;align-items:stretch";
  wrap.appendChild(b); wrap.appendChild(lbl);
  chordBarsEl.appendChild(wrap);
}

function chordSensChange(v) { chordSens = parseInt(v); document.getElementById("chord-sens-val").textContent = v; }

function getPitchClasses(analyser, ctx) {
  const fftSize = analyser.fftSize;
  const buf = new Float32Array(fftSize);
  analyser.getFloatFrequencyData(buf);

  const sr = ctx.sampleRate;
  const binHz = sr / fftSize;

  // Adaptive noise floor: median of all bins
  const sorted = Array.from(buf).filter(v => v > -140).sort((a,b) => a-b);
  const noiseFloor = sorted.length ? sorted[Math.floor(sorted.length * 0.4)] : -90;
  // Threshold: noise floor + margin scaled by sensitivity
  const margin = 18 - chordSens * 1.2; // sens=1 → +16dB, sens=10 → +6dB
  const threshold = noiseFloor + margin;

  // Guitar range bins
  const minBin = Math.max(1, Math.floor(70 / binHz));
  const maxBin = Math.min(buf.length - 1, Math.ceil(1400 / binHz));

  // ── Step 1: Peak picking ──────────────────────
  // Find local maxima above threshold with minimum distance
  const minPeakDist = Math.max(1, Math.floor(15 / binHz)); // ~15Hz separation
  const peaks = []; // { bin, mag, freq }

  for (let i = minBin + 1; i < maxBin - 1; i++) {
    if (buf[i] < threshold) continue;
    if (buf[i] <= buf[i-1] || buf[i] <= buf[i+1]) continue; // not a local max
    // Check it's highest in minPeakDist window
    let isPeak = true;
    for (let j = Math.max(minBin, i - minPeakDist); j <= Math.min(maxBin, i + minPeakDist); j++) {
      if (j !== i && buf[j] >= buf[i]) { isPeak = false; break; }
    }
    if (!isPeak) continue;
    // Parabolic interpolation for sub-bin accuracy
    const alpha = buf[i-1], beta = buf[i], gamma = buf[i+1];
    const denom = alpha - 2*beta + gamma;
    const frac = denom !== 0 ? 0.5 * (alpha - gamma) / denom : 0;
    const freq = (i + frac) * binHz;
    peaks.push({ bin: i, mag: buf[i], freq });
  }

  if (peaks.length === 0) return { pcEnergy: new Float32Array(12), bassPC: -1 };

  // ── Step 2: Harmonic suppression ─────────────
  // For each peak, reduce energy of bins that are its harmonics
  // Sort peaks by magnitude descending
  peaks.sort((a, b) => b.mag - a.mag);
  const suppressed = new Set();

  for (let pi = 0; pi < peaks.length; pi++) {
    if (suppressed.has(pi)) continue;
    const f0 = peaks[pi].freq;
    // Mark harmonics (2nd through 6th)
    for (let h = 2; h <= 6; h++) {
      const hFreq = f0 * h;
      if (hFreq > 1400) break;
      // Find any peak within 2% of this harmonic
      for (let pj = pi + 1; pj < peaks.length; pj++) {
        if (suppressed.has(pj)) continue;
        const ratio = peaks[pj].freq / hFreq;
        if (ratio > 0.98 && ratio < 1.02) {
          suppressed.add(pj);
        }
      }
    }
  }

  // ── Step 3: Build chroma from surviving peaks ─
  const pcEnergy = new Float32Array(12);
  let bassPC = -1, bassMaxMag = -Infinity;

  for (let pi = 0; pi < peaks.length; pi++) {
    if (suppressed.has(pi)) continue;
    const { freq, mag } = peaks[pi];
    const midi = 12 * Math.log2(freq / 440) + 69;
    const pc = ((Math.round(midi) % 12) + 12) % 12;
    // Weight: linear amplitude, not squared — favors fundamentals over noise
    const amp = Math.pow(10, mag / 20);
    pcEnergy[pc] += amp;
    // Bass: lowest unsuppressed peak below 330Hz
    if (freq < 330 && mag > bassMaxMag) { bassMaxMag = mag; bassPC = pc; }
  }

  return { pcEnergy, bassPC };
}

let chordHistory = [], chordHistorySize = 4;

function chordUpdate() {
  if (!chordAnalyser) return;
  chordRaf = requestAnimationFrame(chordUpdate);

  const { pcEnergy, bassPC } = getPitchClasses(chordAnalyser, chordCtx);

  // Draw spectrum
  const fftBuf = new Float32Array(chordAnalyser.frequencyBinCount);
  chordAnalyser.getFloatFrequencyData(fftBuf);
  const sw = chordSpecCanvas.offsetWidth || 300;
  chordSpecCanvas.width = sw; chordSpecCanvas.height = 50;
  chordSpecCtx.fillStyle = "#050a03"; chordSpecCtx.fillRect(0, 0, sw, 50);
  chordSpecCtx.strokeStyle = "#39ff14"; chordSpecCtx.lineWidth = 1.5;
  chordSpecCtx.beginPath();
  const step = Math.floor(fftBuf.length / sw);
  for (let x = 0; x < sw; x++) {
    let mx = -Infinity;
    for (let j = 0; j < step; j++) mx = Math.max(mx, fftBuf[x*step+j]||(-140));
    const y = ((mx + 140) / 100) * 50;
    x === 0 ? chordSpecCtx.moveTo(x, 50-y) : chordSpecCtx.lineTo(x, 50-y);
  }
  chordSpecCtx.stroke();

  // Normalize pc energies
  const maxE = Math.max(...pcEnergy);
  if (maxE < 1e-6) return;
  const normE = Array.from(pcEnergy).map(e => e / maxE);

  // Threshold: include PCs with relative energy > 15%
  const THRESH = 0.15;
  const activePCs = new Set();
  normE.forEach((e, i) => { if (e > THRESH) activePCs.add(i); });

  // Update bars
  const bars = chordBarsEl.querySelectorAll(".chord-bar");
  normE.forEach((e, i) => {
    const h = Math.max(2, e * 34);
    bars[i].style.height = h + "px";
    bars[i].className = "chord-bar";
  });

  // Match chord with stability buffer
  const match = matchChord(activePCs);
  const matchKey = match ? (match.root + "_" + match.name) : "";
  chordHistory.push(matchKey);
  if (chordHistory.length > chordHistorySize) chordHistory.shift();
  // Only display if last N frames agree
  const stableMatch = chordHistory.length === chordHistorySize &&
    chordHistory.every(k => k === matchKey) && match;

  if (stableMatch) {
    const rootName = CHORD_NOTE_NAMES[match.root];
    chordMain.textContent = rootName + match.name;

    // Color bars
    activePCs.forEach(pc => {
      bars[pc].classList.add(pc === match.root ? "root" : "active");
    });

    // Notes in chord
    chordNotesEl.innerHTML = "";
    // Sort detected PCs: root first, then others
    const sorted = [match.root, ...[...activePCs].filter(p => p !== match.root).sort((a,b)=>((a-match.root+12)%12)-((b-match.root+12)%12))];
    sorted.forEach(pc => {
      if (!activePCs.has(pc)) return;
      const pill = document.createElement("span");
      pill.className = "chord-note-pill" + (pc === match.root ? " root" : "");
      pill.textContent = CHORD_NOTE_NAMES[pc];
      chordNotesEl.appendChild(pill);
    });

    // Slash chord
    const slashName = (bassPC >= 0 && bassPC !== match.root) ? getSlashChord(match, bassPC) : null;
    chordSub.textContent = slashName ? "anche: " + slashName : (match.name === "" ? "accordo maggiore" : "");

    // Aliases
    const aliasParts = [];
    const enh = enharmonic(rootName);
    if (enh) aliasParts.push(enh + match.name);
    if (slashName) {
      const slashRoot = slashName.split("/")[0];
      const enhSlash = enharmonic(CHORD_NOTE_NAMES[match.root]);
      if (enhSlash) aliasParts.push(enhSlash + match.name + "/" + CHORD_NOTE_NAMES[bassPC]);
    }
    chordAliases.textContent = aliasParts.length ? "≡ " + aliasParts.join("  ") : "";
  } else if (activePCs.size > 0 && !stableMatch) {
    // Don't flash "?" — keep last valid chord or show "..." while stabilizing
    if (!match) {
      chordMain.textContent = "···";
      chordSub.textContent = ""; chordNotesEl.innerHTML = ""; chordAliases.textContent = "";
    }
    [...activePCs].forEach(pc => bars[pc].classList.add("active"));
  } else if (activePCs.size === 0) {
    chordMain.textContent = "—";
    chordSub.textContent = ""; chordNotesEl.innerHTML = ""; chordAliases.textContent = "";
    chordHistory = [];
  }
}

chordStartBtn.onclick = async () => {
  if (chordRunning) {
    chordRunning = false;
    if (chordRaf) cancelAnimationFrame(chordRaf);
    if (chordMicStream) chordMicStream.getTracks().forEach(t => t.stop());
    if (chordCtx) chordCtx.close();
    chordCtx = chordAnalyser = chordMicStream = null;
    chordDot.className = "dot"; chordBtnLabel.textContent = "Start microphone";
    chordStartBtn.className = "start-btn";
    chordMain.textContent = "—"; chordSub.textContent = "";
    chordNotesEl.innerHTML = ""; chordAliases.textContent = "";
    return;
  }
  try {
    chordMicStream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false
    }});
    chordCtx = new (window.AudioContext || window.webkitAudioContext)();
    chordAnalyser = chordCtx.createAnalyser();
    chordAnalyser.fftSize = 8192;       // alta risoluzione freq per accordi
    chordAnalyser.smoothingTimeConstant = 0.82;
    chordCtx.createMediaStreamSource(chordMicStream).connect(chordAnalyser);
    chordRunning = true;
    chordDot.className = "dot on"; chordBtnLabel.textContent = "Stop microphone";
    chordStartBtn.className = "start-btn active";
    requestAnimationFrame(chordUpdate);
  } catch(e) { alert("Cannot access microphone:\n" + e.message); }
};


// ════════════════════════════════════════════════
//  PITCH PIPE
// ════════════════════════════════════════════════
let pipeCtx = null, pipeOsc = null, pipeGain = null, pipeRunning = false, pipeIntervalId = null;
const pipeDot   = document.getElementById("pipe-dot");
const pipeLabel = document.getElementById("pipe-label");
const pipeBtn   = document.getElementById("pipe-btn");

function pipeToggle() {
  if (pipeRunning) {
    pipeStop();
  } else {
    pipeStart();
  }
}

function pipeStart() {
  const freq = noteToFreq(tunings[currentTuning][selectedString]);
  if (!freq) return;
  if (!pipeCtx) pipeCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (pipeCtx.state === "suspended") pipeCtx.resume();

  pipeRunning = true;
  pipeDot.className = "dot on";
  pipeLabel.textContent = "Stop reference note";
  pipeBtn.className = "start-btn active";

  playPipeNote(freq);
  // Ripete ogni 2.5 secondi
  pipeIntervalId = setInterval(() => {
    const f = noteToFreq(tunings[currentTuning][selectedString]);
    if (f) playPipeNote(f);
  }, 2500);
}

function playPipeNote(freq) {
  // Stop previous note if playing
  if (pipeOsc) { try { pipeOsc.stop(); } catch(e){} pipeOsc = null; }

  pipeGain = pipeCtx.createGain();
  pipeGain.gain.setValueAtTime(0, pipeCtx.currentTime);
  pipeGain.gain.linearRampToValueAtTime(0.4, pipeCtx.currentTime + 0.01);
  pipeGain.gain.setValueAtTime(0.4, pipeCtx.currentTime + 1.2);
  pipeGain.gain.linearRampToValueAtTime(0, pipeCtx.currentTime + 2.0);
  pipeGain.connect(pipeCtx.destination);

  // Main oscillator + sub octave for body
  pipeOsc = pipeCtx.createOscillator();
  pipeOsc.type = "triangle";
  pipeOsc.frequency.value = freq;
  pipeOsc.connect(pipeGain);
  pipeOsc.start();
  pipeOsc.stop(pipeCtx.currentTime + 2.0);

  // Light sub octave
  const sub = pipeCtx.createOscillator();
  const subGain = pipeCtx.createGain();
  sub.type = "sine";
  sub.frequency.value = freq / 2;
  subGain.gain.value = 0.15;
  sub.connect(subGain); subGain.connect(pipeGain);
  sub.start(); sub.stop(pipeCtx.currentTime + 2.0);
}

function pipeStop() {
  pipeRunning = false;
  clearInterval(pipeIntervalId);
  if (pipeOsc) { try { pipeOsc.stop(); } catch(e){} pipeOsc = null; }
  pipeDot.className = "dot";
  pipeLabel.textContent = "Play reference note";
  pipeBtn.className = "start-btn";
}

// Stop pipe if string or tuning changes
const _origBuildStringBtns = buildStringBtns;
buildStringBtns = function() { _origBuildStringBtns(); if (pipeRunning) { pipeStop(); pipeStart(); } };


// ── PWA Service Worker ──────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>

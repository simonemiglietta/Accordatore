<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Guitar Tuner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tuner">
<meta name="theme-color" content="#0a0f06">
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #39ff14;
    --green-dim: #2db810;
    --green-glow: rgba(57,255,20,0.18);
    --green-glow-strong: rgba(57,255,20,0.35);
    --amber: #ffb000;
    --red: #ff3b3b;
    --bg: #111a09;
    --surface: #172210;
    --surface2: #1c2a14;
    --border: rgba(57,255,20,0.38);
    --border-bright: rgba(57,255,20,0.65);
    --text: #39ff14;
    --text-dim: #3ed614;
    --text-muted: #2db810;
    --font: 'Share Tech Mono', 'Courier New', monospace;
    --radius: 4px;
    --scanline-size: 3px;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(0.75rem + env(safe-area-inset-top)) 0.875rem calc(1rem + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) var(--scanline-size)
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 8px var(--green);
    transition: opacity 0.6s ease;
    overflow: hidden;
    max-height: 40px;
    margin-bottom: 1.5rem;
  }
  h1 .ver {
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.5;
    margin-left: 6px;
    vertical-align: middle;
  }
  h1.hidden {
    opacity: 0;
    max-height: 0 !important;
    margin-bottom: 0 !important;
    padding: 0 !important;
    line-height: 0 !important;
    pointer-events: none;
  }

  /* ── Tabs ── */
  .tab-nav {
    display: flex;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  .tab-btn {
    flex: 1;
    padding: 8px 4px;
    font-size: 10px;
    font-family: var(--font);
    font-weight: normal;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn.active {
    background: var(--green-glow);
    color: var(--text);
    text-shadow: 0 0 6px var(--green);
  }
  .tab-panel { display: none; height: 0; overflow: hidden; }
  .tab-panel.active { display: block; height: auto; overflow: visible; }

  /* ── Tuning pills ── */
  .tunings-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
  .tuning-btn {
    font-size: 10px;
    font-family: var(--font);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tuning-btn.active {
    border-color: var(--green);
    color: var(--text);
    background: var(--green-glow);
    text-shadow: 0 0 6px var(--green);
  }

  /* ── String buttons ── */
  .strings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 24px; }
  .string-btn {
    padding: 12px 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .string-btn:active { transform: scale(0.97); }
  .string-btn .note { font-size: 20px; font-family: var(--font); letter-spacing: -1px; }
  .string-btn .freq { font-size: 9px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.5px; }
  .string-btn.selected {
    border-color: var(--green);
    color: var(--text);
    background: var(--green-glow);
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 10px var(--green-glow), inset 0 0 8px var(--green-glow);
  }
  .string-btn.selected .freq { color: var(--text-dim); }

  /* ── Meter card ── */
  .meter-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 0.75rem 1rem 0.75rem;
    margin-bottom: 24px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px rgba(0,0,0,0.4);
  }
  .meter-card::before {
    content: '[ TUNER ]';
    position: absolute;
    top: -8px; left: 12px;
    font-size: 9px;
    letter-spacing: 2px;
    background: var(--bg);
    padding: 0 6px;
    color: var(--text-dim);
  }
  .note-display { margin-bottom: 6px; }
  .detected-note {
    font-size: 60px;
    font-family: var(--font);
    font-weight: normal;
    line-height: 1;
    letter-spacing: -3px;
    color: var(--text);
    text-shadow: 0 0 20px var(--green), 0 0 40px rgba(57,255,20,0.3);
    transition: color 0.2s, text-shadow 0.2s;
    display: inline-block;
  }
  .detected-note.in-tune {
    color: var(--text);
    text-shadow: 0 0 30px var(--green), 0 0 60px var(--green), 0 0 80px rgba(57,255,20,0.4);
    animation: pulse-glow 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse-glow {
    from { text-shadow: 0 0 20px var(--green), 0 0 40px rgba(57,255,20,0.3); }
    to   { text-shadow: 0 0 35px var(--green), 0 0 70px var(--green), 0 0 100px rgba(57,255,20,0.5); }
  }
  .detected-freq {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 1px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gauge-canvas { width: 100%; height: 80px; display: block; margin-bottom: 2px; }
  .cents-label {
    font-size: 11px;
    font-family: var(--font);
    letter-spacing: 1px;
    margin-top: 8px;
    color: var(--text-muted);
    min-height: 20px;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .cents-label.in-tune { color: var(--text); text-shadow: 0 0 6px var(--green); }
  .cents-label.sharp { color: var(--red); text-shadow: 0 0 6px var(--red); }
  .cents-label.flat  { color: var(--amber); text-shadow: 0 0 6px var(--amber); }

  .history-wrap { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); }
  .history-label { font-size: 9px; color: var(--text-muted); margin-bottom: 5px; text-align: left; letter-spacing: 2px; text-transform: uppercase; }
  .history-bar { display: flex; gap: 2px; height: 20px; align-items: flex-end; }
  .history-bar .hbar { flex: 1; border-radius: 1px; min-height: 2px; transition: height 0.1s, background 0.15s; }

  /* ── Controls ── */
  .controls-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    margin-bottom: 24px;
    position: relative;
  }
  .controls-card::before {
    content: '[ SETTINGS ]';
    position: absolute;
    top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px;
    color: var(--text-muted);
  }
  .ctrl-row { display: flex; align-items: center; gap: 10px; }
  .ctrl-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; min-width: 80px; letter-spacing: 1px; text-transform: uppercase; }
  .ctrl-row input[type=range] { flex: 1; }
  .ctrl-val { font-size: 12px; color: var(--text); min-width: 32px; text-align: right; }

  /* ── Buttons ── */
  .start-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 11px;
    font-family: var(--font);
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .start-btn:active { transform: scale(0.98); }
  .start-btn.active {
    border-color: var(--green);
    color: var(--text);
    background: var(--green-glow);
    text-shadow: 0 0 6px var(--green);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .dot.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green), 0 0 12px var(--green);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ── Looper ── */
  .looper-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 0.625rem;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 0 0 15px var(--green-glow);
  }
  .looper-card::before {
    content: '[ LOOPER ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-dim);
  }
  .looper-status { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 6px; min-height: 16px; }
  .looper-status.recording { color: var(--red); text-shadow: 0 0 6px var(--red); animation: blink 0.6s linear infinite; }
  .looper-status.playing { color: var(--text); text-shadow: 0 0 6px var(--green); }
  .looper-status.processing { color: var(--text-muted); }
  canvas.looper-waveform { width: 100%; height: 44px; border-radius: 2px; background: #050a03; border: 1px solid var(--border); margin-bottom: 10px; display: block; }
  .loop-progress-wrap { height: 2px; background: var(--surface2); margin-bottom: 8px; overflow: hidden; }
  .loop-progress-bar { height: 100%; width: 0%; background: var(--green); box-shadow: 0 0 4px var(--green); transition: width 0.05s linear; }

  .looper-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
  .lbtn {
    padding: 9px 8px 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: var(--font);
    cursor: pointer;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .lbtn:active { transform: scale(0.96); }
  .lbtn .licon { font-size: 18px; line-height: 1; }
  .lbtn .llabel { font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .lbtn.rec-active { border-color: var(--red); color: var(--red); background: rgba(255,59,59,0.1); text-shadow: 0 0 6px var(--red); }
  .lbtn.rec-active .llabel { color: var(--red); }
  .lbtn.play-active { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 6px var(--green); }
  .lbtn.play-active .llabel { color: var(--text-dim); }
  .lbtn:disabled { opacity: 0.2; pointer-events: none; }

  .loop-ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .loop-ctrl-row input[type=range] { flex: 1; }
  .loop-ctrl-label { font-size: 9px; color: var(--text-muted); white-space: nowrap; min-width: 90px; letter-spacing: 1px; text-transform: uppercase; }
  .loop-ctrl-val { font-size: 11px; color: var(--text); min-width: 40px; text-align: right; }

  /* ── Metronome ── */
  .metro-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.5rem 0.625rem;
    margin-top: 28px;
    position: relative;
  }
  .metro-card::before {
    content: '[ METRONOME ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-muted);
  }
  .metro-toggle {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .metro-toggle.on { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 6px var(--green); }
  .metro-step-btn {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 16px;
    cursor: pointer; transition: all 0.12s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .metro-step-btn:active { color: var(--text); border-color: var(--green); transform: scale(0.9); }
  .metro-bpm-row { display: flex; align-items: center; gap: 5px; margin-bottom: 9px; }
  .metro-bpm-row input[type=range] { flex: 1; min-width: 0; }
  .metro-bpm-val { font-size: 24px; min-width: 44px; text-align: right; text-shadow: 0 0 10px var(--green); letter-spacing: -1px; }
  .metro-bpm-unit { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
  .metro-sig-row { display: flex; gap: 5px; margin-bottom: 9px; }
  .metro-sig-btn {
    flex: 1; padding: 6px 4px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 11px; letter-spacing: 0.5px;
    cursor: pointer; text-align: center; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .metro-sig-btn.active { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 5px var(--green); }
  .metro-beats { display: flex; gap: 8px; justify-content: center; }
  .metro-beat {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1px solid var(--text-muted);
    background: transparent;
    transition: all 0.05s;
  }
  .metro-beat.accent { border-color: var(--text-dim); }
  .metro-beat.lit {
    background: var(--green) !important;
    border-color: var(--green) !important;
    box-shadow: 0 0 8px var(--green), 0 0 16px var(--green-glow) !important;
    transform: scale(1.3);
  }
  .metro-muted-note { font-size: 9px; color: var(--red); text-align: center; margin-top: 5px; min-height: 10px; letter-spacing: 1px; text-transform: uppercase; }

  /* ── Trainer ── */
  .trainer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.5rem 0.625rem;
    margin-top: 28px;
    position: relative;
  }
  .trainer-card::before {
    content: '[ BPM TRAINER ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-muted);
  }
  .trainer-toggle {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-family: var(--font);
    font-size: 13px;
    cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .trainer-toggle.on { border-color: var(--red); color: var(--red); background: rgba(255,59,59,0.1); text-shadow: 0 0 6px var(--red); }
  .trainer-row { display: flex; align-items: center; gap: 5px; margin-bottom: 9px; }
  .trainer-row:last-child { margin-bottom: 0; }
  .trainer-row input[type=range] { flex: 1; }
  .trainer-lbl { font-size: 9px; color: var(--text-muted); white-space: nowrap; min-width: 68px; letter-spacing: 1px; text-transform: uppercase; }
  .trainer-val { font-size: 12px; color: var(--text); min-width: 36px; text-align: right; white-space: nowrap; }
  .trainer-step-row { display: flex; align-items: center; gap: 0; margin-bottom: 9px; }
  .trainer-step-lbl { font-size: 9px; color: var(--text-muted); min-width: 68px; letter-spacing: 1px; text-transform: uppercase; }
  .step-btn {
    width: 34px; height: 34px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.1s; -webkit-tap-highlight-color: transparent;
  }
  .step-btn:active { transform: scale(0.9); color: var(--text); border-color: var(--green); }
  .step-val-box { font-size: 18px; min-width: 48px; text-align: center; color: var(--text); text-shadow: 0 0 6px var(--green); }
  .trainer-status { font-size: 9px; color: var(--text-dim); text-align: center; min-height: 12px; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

  /* ── Chord Finder ── */
  .chord-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 1.5rem 1rem 1.25rem;
    margin-bottom: 24px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 0 20px var(--green-glow);
  }
  .chord-card::before {
    content: '[ CHORD DETECT ]';
    position: absolute; top: -8px; left: 12px;
    font-size: 9px; letter-spacing: 2px;
    background: var(--bg); padding: 0 6px; color: var(--text-dim);
  }
  .chord-main {
    font-size: 64px; font-family: var(--font); font-weight: normal;
    line-height: 1; letter-spacing: -2px;
    color: var(--text);
    text-shadow: 0 0 20px var(--green), 0 0 40px rgba(57,255,20,0.2);
    min-height: 70px;
  }
  .chord-sub  { font-size: 11px; color: var(--text-dim); margin-top: 6px; min-height: 20px; letter-spacing: 1px; text-transform: uppercase; }
  .chord-notes { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; min-height: 26px; }
  .chord-note-pill {
    font-size: 10px; font-family: var(--font); letter-spacing: 1px;
    padding: 3px 8px; border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-dim);
  }
  .chord-note-pill.root { border-color: var(--green); color: var(--text); background: var(--green-glow); text-shadow: 0 0 4px var(--green); }
  .chord-aliases { font-size: 10px; color: var(--text-muted); margin-top: 8px; min-height: 18px; letter-spacing: 1px; }
  .chord-bars-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    margin-bottom: 24px;
  }
  canvas.chord-spectrum { width: 100%; height: 50px; display: block; border-radius: 2px; margin-bottom: 8px; background: #050a03; border: 1px solid var(--border); }
  .chord-bars { display: flex; gap: 3px; height: 36px; align-items: flex-end; }
  .chord-bar  { flex: 1; border-radius: 1px; min-height: 2px; background: var(--text-muted); transition: height 0.1s, background 0.15s; }
  .chord-bar.active { background: var(--text-dim); box-shadow: 0 0 4px var(--green-glow); }
  .chord-bar.root   { background: var(--text); box-shadow: 0 0 6px var(--green); }
  .chord-ctrl-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 0.75rem;
  }
  .chord-ctrl-lbl { font-size: 9px; color: var(--text-muted); white-space: nowrap; min-width: 80px; letter-spacing: 1px; text-transform: uppercase; }
  .chord-ctrl-row input[type=range] { flex: 1; }
  .chord-ctrl-val { font-size: 12px; color: var(--text); min-width: 20px; text-align: right; }

  /* ── Custom inline edit ── */
  #custom-edit-panel { margin-bottom: 16px; }
  .edit-custom-btn {
    font-size: 9px; font-family: var(--font);
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer; transition: all 0.15s;
    margin-bottom: 14px; display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-custom-btn:active { border-color: var(--green); color: var(--text); background: var(--green-glow); }
  .custom-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .custom-inputs input {
    width: 100%; font-size: 15px; font-family: var(--font); text-align: center;
    padding: 8px 4px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    text-shadow: 0 0 4px var(--green);
  }
  .custom-inputs input:focus { outline: none; border-color: var(--green); background: var(--green-glow); }
  .custom-actions-row { display: flex; gap: 8px; }
  .apply-btn {
    flex: 2; padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 10px; font-family: var(--font);
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .apply-btn:active { border-color: var(--green); color: var(--text); background: var(--green-glow); }
  .cancel-btn {
    flex: 1; padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 10px; font-family: var(--font);
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .cancel-btn:active { border-color: var(--red); color: var(--red); }

  /* ── Tap Tempo ── */
  .tap-btn {
    width: 100%; padding: 28px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 13px; font-family: var(--font);
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; transition: all 0.08s;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 9px;
  }
  .tap-btn:active {
    border-color: var(--green); color: var(--text);
    background: var(--green-glow); transform: scale(0.97);
    text-shadow: 0 0 6px var(--green);
  }

  /* ── Countdown toggle ── */
  .loop-cdown-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font); font-size: 14px;
    cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .loop-cdown-btn.active {
    border-color: var(--green); color: var(--green);
    background: var(--green-glow); text-shadow: 0 0 6px var(--green);
  }

  /* ── Speed step buttons ── */
  .speed-step-btn {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font); font-size: 16px;
    cursor: pointer; transition: all 0.12s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .speed-step-btn:active { color: var(--text); border-color: var(--green); transform: scale(0.9); }
  .speed-step-btn:disabled { opacity: 0.2; pointer-events: none; }

  /* ── Range inputs ── */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right,
      var(--green) 0%,
      var(--green) var(--fill, 0%),
      var(--surface2) var(--fill, 0%),
      var(--surface2) 100%
    );
    border: 1px solid var(--border);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    margin-top: -8px;
    border: none;
  }
  input[type=range]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  input[type=range]::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--green);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    border: none;
  }

  /* ── Install Banner ── */
  #install-banner {
    position: fixed;
    bottom: calc(1rem + env(safe-area-inset-bottom));
    left: 0.875rem; right: 0.875rem;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 10px;
    z-index: 9997;
    box-shadow: 0 0 20px var(--green-glow);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  #install-text { flex: 1; }
  #install-btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--green);
    background: var(--green-glow);
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    text-shadow: 0 0 6px var(--green);
    white-space: nowrap;
  }
  #install-dismiss {
    padding: 4px 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
<audio id="ios-speaker-unlock" playsinline style="display:none"></audio>
<div id="install-banner" style="display:none">
  <span id="install-text">📲 Add to home screen</span>
  <button id="install-btn">Install</button>
  <button id="install-dismiss">✕</button>
</div>
<h1 id="splash-title">🎸 Guitar Tuner<span class="ver">v24</span></h1>

<div class="tab-nav">
  <button class="tab-btn active" data-tab="tuner">Tuner</button>
  <button class="tab-btn" data-tab="looper">Looper</button>
  <button class="tab-btn" data-tab="chord">Chords</button>
</div>

<!-- ══ TAB TUNER ══ -->
<div class="tab-panel active" id="tab-tuner">
  <div class="tunings-row" id="tunings-row"></div>
  <button id="edit-custom-btn" class="edit-custom-btn" style="display:none">✎ Edit notes</button>
  <div id="custom-edit-panel" style="display:none">
    <div class="custom-inputs" id="custom-inputs"></div>
    <div class="custom-actions-row">
      <button class="cancel-btn" id="cancel-btn">✕ Cancel</button>
      <button class="apply-btn" id="apply-btn">✓ Apply</button>
    </div>
  </div>
  <div class="strings-grid" id="strings-grid"></div>
  <div class="meter-card">
    <div class="note-display">
      <div class="detected-note" id="detected-note">—</div>
      <div class="detected-freq" id="detected-freq">0.0 Hz</div>
    </div>
    <canvas id="gauge-canvas" class="gauge-canvas"></canvas>
    <div class="cents-label" id="cents-label">select a string and start</div>
    <div class="history-wrap">
      <div class="history-label">Stability last 2s</div>
      <div class="history-bar" id="history-bar"></div>
    </div>
  </div>
  <div class="controls-card">
    <div class="ctrl-row">
      <span class="ctrl-label">Sensitivity</span>
      <input type="range" id="sensitivity" min="1" max="10" step="1" value="5">
      <span class="ctrl-val" id="sens-val">5</span>
    </div>
  </div>
  <button class="start-btn" id="start-btn">
    <span class="dot" id="dot"></span><span id="btn-label">Start microphone</span>
  </button>
  <button class="start-btn" id="pipe-btn" style="margin-top:-0.5rem">
    <span class="dot" id="pipe-dot"></span><span id="pipe-label">Play reference note</span>
  </button>
</div><!-- /tab-tuner -->

<!-- ══ TAB LOOPER ══ -->
<div class="tab-panel" id="tab-looper">
  <div class="looper-card">
    <div class="looper-status" id="looper-status">Press REC to start</div>
    <canvas class="looper-waveform" id="looper-waveform"></canvas>
    <div class="loop-progress-wrap"><div class="loop-progress-bar" id="loop-progress"></div></div>

    <div class="looper-btns">
      <button class="lbtn" id="lbtn-rec">
        <span class="licon">●</span><span class="llabel">REC</span>
      </button>
      <button class="lbtn" id="lbtn-clear" disabled>
        <span class="licon">✕</span><span class="llabel">CLEAR</span>
      </button>
      <button class="lbtn" id="lbtn-stop" disabled>
        <span class="licon">■</span><span class="llabel">STOP</span>
      </button>
      <button class="lbtn" id="lbtn-play" disabled>
        <span class="licon">▶</span><span class="llabel">PLAY / LOOP</span>
      </button>
    </div>

    <div class="loop-ctrl-row">
      <span class="loop-ctrl-label">Speed</span>
      <button class="speed-step-btn" data-delta="-5" disabled>−</button>
      <input type="range" id="loop-speed" min="25" max="100" step="1" value="100" disabled>
      <button class="speed-step-btn" data-delta="5" disabled>+</button>
      <span class="loop-ctrl-val" id="loop-speed-val">100%</span>
    </div>
    <div class="loop-ctrl-row">
      <span class="loop-ctrl-label">Countdown</span>
      <button class="loop-cdown-btn active" id="loop-countdown-toggle">●</button>
    </div>
  </div>

  <div class="metro-card">
    <div class="metro-bpm-row">
      <button class="metro-toggle" id="metro-toggle">▶</button>
      <button class="metro-step-btn" data-delta="-1">−</button>
      <input type="range" id="metro-bpm" min="40" max="240" step="1" value="120">
      <button class="metro-step-btn" data-delta="1">+</button>
      <span class="metro-bpm-val" id="metro-bpm-val">120</span>
      <span class="metro-bpm-unit">BPM</span>
    </div>
    <button class="tap-btn" id="tap-btn">TAP TEMPO</button>
    <div class="metro-sig-row">
      <button class="metro-sig-btn" data-beats="2">2/4</button>
      <button class="metro-sig-btn" data-beats="3">3/4</button>
      <button class="metro-sig-btn active" data-beats="4">4/4</button>
      <button class="metro-sig-btn" data-beats="6">6/8</button>
    </div>
    <div class="metro-beats" id="metro-beats"></div>
    <div class="metro-muted-note" id="metro-muted-note"></div>
    <div class="trainer-card">
      <div class="trainer-row">
        <button class="trainer-toggle" id="trainer-toggle">▶</button>
        <button class="metro-step-btn trainer-period-btn" data-delta="-1">−</button>
        <input type="range" id="trainer-period" min="1" max="32" step="1" value="4">
        <button class="metro-step-btn trainer-period-btn" data-delta="1">+</button>
        <span class="trainer-val" id="trainer-period-val">4 bt</span>
      </div>
      <div class="trainer-step-row">
        <span class="trainer-step-lbl">BPM step</span>
        <button class="step-btn trainer-step-btn" data-delta="-1">−</button>
        <span class="step-val-box" id="trainer-step-val">+2</span>
        <button class="step-btn trainer-step-btn" data-delta="1">+</button>
      </div>
      <div class="trainer-row">
        <span class="trainer-lbl">Target BPM</span>
        <input type="range" id="trainer-target" min="40" max="240" step="1" value="160">
        <span class="trainer-val" id="trainer-target-val">160</span>
      </div>
      <div class="trainer-status" id="trainer-status"></div>
    </div>
  </div>
</div><!-- /tab-looper -->

<!-- ══ TAB CHORD FINDER ══ -->
<div class="tab-panel" id="tab-chord">
  <div class="chord-card" id="chord-card">
    <div class="chord-main" id="chord-main">—</div>
    <div class="chord-sub" id="chord-sub"></div>
    <div class="chord-notes" id="chord-notes"></div>
    <div class="chord-aliases" id="chord-aliases"></div>
  </div>
  <div class="chord-bars-wrap">
    <canvas id="chord-spectrum" class="chord-spectrum"></canvas>
    <div class="chord-bars" id="chord-bars"></div>
  </div>
  <div class="chord-ctrl-row">
    <span class="chord-ctrl-lbl">Sensitivity</span>
    <input type="range" id="chord-sens" min="1" max="10" step="1" value="5">
    <span class="chord-ctrl-val" id="chord-sens-val">5</span>
  </div>
  <button class="start-btn" id="chord-start-btn" style="margin-top:0.5rem">
    <span class="dot" id="chord-dot"></span><span id="chord-btn-label">Start microphone</span>
  </button>
</div><!-- /tab-chord -->


<script type="module" src="js/app.js"></script>
</body>
</html>
